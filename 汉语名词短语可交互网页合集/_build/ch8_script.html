<script>
"use strict";
/* ================= 事实账本（出处库） ================= */
const SOURCES = {
  bookInfo:{ch:"第八章",page:"封面",quote:"认知语言学与汉语名词短语 ＞ 作者：张敏",zh:"《认知语言学与汉语名词短语》（张敏 著）第八章"},
  belief:{page:"8.0",quote:"我们在分析汉语定中结构间de字的隐现规律时，自始至终持有一个基本的信念，即句法形式并不都是受制于抽象性质的原则与规则，表层的句法表现之下往往可以找到认知—语义上的理据，尤其是当类似的概念语义结构在同一语言中及不同语言间一再以类似的表层形式表达的时候",zh:"基本信念：句法形式并非都受制于抽象规则，表层句法之下往往可以找到认知—语义理据。"},
  projection:{page:"8.0",quote:"作为概念化过程结果的语义结构直接投射于表层句法的情况要远远多过一般人所设想的（参见Langacker 1990，Tai 1993a）。",zh:"语义结构直接投射于表层句法的情况远比一般人所设想的更多。"},
  corroborate:{page:"8.0",quote:"我们用距离象似动因解释汉语里de字的隐现，这种解释可得到大量语言里名词短语构成方式上的佐证，这种语义与形式同构的现象分布之广泛，使我们不得不相信这一基于象似性的解释是能够成立的，除非我们能就这个问题从其他角度提出更好的解释。",zh:"距离象似动因得到大量语言名词短语构成方式的佐证，除非有更好的解释，否则可以成立。"},
  pts:{page:"8.0",quote:"戴浩一（Tai 1985）从次序象似性的角度提出的“时间顺序原则”便是一个很好的例子，这个原则概括了汉语里大量以动词为中心的，表面上互不相干的句法范畴的语序表现。",zh:"时间顺序原则概括了汉语大量以动词为中心的、表面互不相干的语序表现。"},
  zhang1995b:{page:"8.0",quote:"我们在另一篇文章里提出，管辖汉语以名词为中心的句法构造的语序表现的正是距离象似原则(Zhang1995b)。",zh:"作者另一篇文章提出：汉语以名词为中心的句法构造，其语序由距离象似原则管辖。"},
  twoPhen:{page:"8.0",quote:"表面上看，定中之间de字的隐现和多项定语的相对语序是两个独立的现象，但我们在前一种现象中发现的规律却相当系统地反映在后一种现象里。限于篇幅，在此只简要说明两种现象里规律的一致性。",zh:"de 字隐现与多项定语语序看似独立，实则前者发现的规律系统地反映在后者里。"},
  zhuRules:{page:"8.0",quote:"朱德熙(1957)最早将递加的多项定语的次序安排概括为以下三个方面的规则：第一，如果几个定语都不带dc，一般的次序是：(1)表领属的名词或代词，(2)数量词，(3)形容词，(4)表性质的名词；第二，在带de的定语里头，表领属的名词或代词仍然在最前面；第三，带de的定语一定在不带de的定语之前。",zh:"朱德熙三条规则：不带 de 时次序为领属＞数量＞形容词＞性质名词；带 de 的定语中领属仍在最前；带 de 的定语在不带 de 的之前。"},
  zhuEx:{page:"8.0",quote:"下面是朱德熙的例子(我们作了些许调整)：(1)他的(1)把(2)小(3)瓷(4)茶壶。(2)张三的(1)两个(2)破(3)墨水(4)瓶儿。(3)a. 瓷的小茶壶 b. 小瓷的茶壶（比较：小瓷茶壶，小的瓷茶壶）(4)a. 绣花的绸衬衫 b. 绸绣花的衬衫（比较：绸的绣花衬衫）",zh:"朱德熙的四个例子，括弧内数字指标注定语的次序。"},
  onePrinciple:{page:"8.0",quote:"从形式上提出的这些规则可以概括地重述为一条象似原则：定语和中心语之间的距离取决于它们所表达的概念之间的距离。",zh:"三条形式规则可重述为：定语与中心语的距离取决于概念距离。"},
  possAttr:{page:"8.0",quote:"第二和第一条规则指出表领属的体词总是离中心语最远，而我们在前面提过，领有者对事物的影响和属性对事物的影响有本质的不同，事物一般不会随领有者的改变而改变，却一定会随属性的改变而有别，故根据Haiman提出的标准，领有者和事物的概念距离一定比属性远",zh:"事物不随领有者而变却随属性而别，按 Haiman 标准，领有者与事物的概念距离比属性远，故领属定语最远。"},
  numeral:{page:"8.0",quote:"数量成分和领属者对中心语的限定作用有类似之处，带有从事物中“拣选”出某些或某个的意味，故它基本上是作用于概念的外延。但它对物体概念内涵的影响要稍稍大于领属者，如它可反映物体是否具有[+可数]这样的属性，而它本身又不可看作事物真正的属性，这正好说明了它夹在领有者和属性词之间的位置(参见Seilor 1978)。",zh:"数量词与领属者都作用于外延，但对内涵影响稍大（可反映可数性），自身又不是真属性，故夹在中间。"},
  adjNoun:{page:"8.0",quote:"形容词表示的属性多为我们的感官所感受到的，或与心理估价相关的性质，它们与事物之间的联系没有名词表示的属性那么密切、直接；名词表示的属性多为事物较稳固的性质如质料、身份等，或在事物与人的互动关系中更为显著的性质如用途功能等。试比较“破茶壶”和“瓷茶壶”，其中“破”和“瓷”与茶壶概念联系的松紧有着不言而喻的差别。",zh:"形容词表感官或估价性属性，与事物联系较松；名词表质料、身份、功能等稳固属性，联系更紧，故更贴近中心语。"},
  luSeq:{page:"8.0",quote:"陆内甫(1988)在分析多项组合式定语时发现，其顺序可分化为两个内部次序相对稳定的序列，即指别词和数量词构成的序列与其他定语构成的序列。",zh:"多项组合式定语可分化为两个内部次序稳定的序列：指别＋数量序列与其他定语序列。"},
  twoSeq:{page:"8.0",quote:"根据前面的分析，领属定语与“这那”之类指别成分具有相似的指别作用，故我们认为领属定语应和指别词归为一类。这两个序列放在一起，自然是头一个序列在前。",zh:"领属定语与指别成分作用相似，应归入指别一类；两个序列并置时，指别＋数量序列在前。"},
  stateQuality:{page:"8.0",quote:"后一个序列若刻划得更精细一些，便可发现表情状的形容词复杂形式（如状态形容词、形容词性短语等）一定得放在表性质的形容词简单形式之前（例如“我那件脏里叭唧的新绸子衬衫”），这是因为情状和事物的概念距离比性质更远。",zh:"表情状的形容词复杂形式一定在表性质的形容词简单形式之前，因为情状的概念距离比性质远。"},
  shapeColor:{page:"8.0",quote:"根据陆丙甫(1988)，在表属性的形容词和名词、区别词中，基本的顺序是“形体—颜色—质料—功能”（如“大号白色呢子防风大衣”），其中形体和颜色的次序有时能够调换，但它们一定在质料功能之前，质料也多半在功能之前。与此相应的是，作定语的名词和区别词一般放在形容词之前。",zh:"表属性定语的基本顺序：形体—颜色—质料—功能；名词和区别词一般在形容词之前。"},
  tempInnate:{page:"8.0",quote:"这个顺序的认知理据正如陆丙甫所概括的，是反映事物较临时的状态的定语倾向于靠前，而越是表现事物本身固有性质的定语越是后置。不同语义属性的定语在带de不带de的限制方面也有一致的表现，即表质料功能的定语和表形体颜色的定语相比能更为自由地隐去de。",zh:"临时的状态靠前，固有性质后置；质料功能定语比形体颜色定语能更自由地隐去 de。"},
  preferred:{page:"8.0",quote:"我们在此讨论的只是多项定语的优先语序、强势语序（preferred orders, canonical orders），故不拟深究某些定语在语序上的可变性，不过，表面上语序灵活的形式，其实际次序的不同仍反映了概念距离的不同",zh:"本章只讨论优先语序、强势语序；表面灵活的形式，实际次序仍反映概念距离。"},
  vpDe:{page:"8.0",quote:"如陆丙甫(1988)就曾细致地注意到语序灵活的“VP的”若位置不同其意义会有分化，离中心语近的限定内涵，远的限定外延，如“2500颗投在广岛的原子弹”和“投在广岛的2500颗原子弹”就蕴含着这样的区别。这同样是距离象似动因的反映。",zh:"“VP 的”近中心语者限定内涵，远者限定外延；语序分化同样是距离象似动因的反映。"},
  whyNotice:{page:"8.0",quote:"多项定语语序这个问题之所以引起我们的注意，一方面是因为它和定语带de与否的现象具有相同的认知基础，因而可以印证我们对后者的分析；另一方面是因为类似上面描述的语序还相当广泛地出现在其他不少语言里，具有一定的普遍性。",zh:"多项定语语序与 de 字隐现有相同认知基础，且广泛见于其他语言，故引起注意。"},
  enDeOrder:{page:"8.0",quote:"根据Hill (1958)，Vendler(1968)，Martin(1968)，Seilor(1978)等多位学者的研究，英语和德语前置的多项定语大致形成这样一个优先语序“逻辑量词—指示词/冠词/领属词—数词—表情状的形容词—表估价的形容词—表颜色的形容词—表质料的形容词及名词”。",zh:"英语德语前置多项定语优先语序：逻辑量词—指示/冠词/领属—数词—情状—估价—颜色—质料及名词。"},
  enEx:{page:"8.0",quote:"(5) all the ten pretty young American children's twenty little old china doll (所有这十位漂亮的年轻美国孩子的二十个小小的旧瓷娃娃) (6)meine zehn schonen roten holzernen Kugeln(德语)(我的十个漂亮的红木球)",zh:"英语、德语例子：一个短语内层层都遵循上述序列。"},
  almostSame:{page:"8.0",quote:"上面的序列几乎和汉语完全相同。",zh:"英语德语的序列几乎和汉语完全相同。"},
  turning:{page:"8.0",quote:"Seilor(1978)指出，上述序列中，领属词是个转折点，其前的定语倾向于对中心语的外延进行限定（即确定所指），其后是对内涵的限定和描述（表征概念），这个说法和陆丙甫(1988)对汉语的分析不谋而合。",zh:"领属词是转折点：其前限定外延（确定所指），其后限定内涵（表征概念），与陆丙甫对汉语的分析一致。"},
  wider:{page:"8.0",quote:"更大范围的考察显示，和汉语“一个漂亮的大红球”及英语“a beautiful big red ball”、德语“ein schoner grosser roter Ball”语序一样的还有匈牙利语、波兰语、土耳其语、印地语等多种语言，而定语后置的语言中，其语序多为“球—红—大—漂亮的”，如波斯语、印尼语、巴斯克语等，而这正是与前置语序本质相同的一个镜象（mirror image）（参见Hetzron 1978）。",zh:"匈、波、土、印地等语言与汉语英语同序；波斯、印尼、巴斯克等后置语言呈镜象排列。"},
  greenberg:{page:"8.0",quote:"根据Greenberg(1963)的一条普遍特征规律，若指示语(d)，数词(n)，形容词(a)都在名词前面，则语序总是dnaN；若都在名词后面，则较多的语序是Nand，少数还有Ndna这样的变体。",zh:"Greenberg 共相：d、n、a 全前置则总是 dnaN；全后置则多为 Nand，少数 Ndna。"},
  mirrorWhy:{page:"8.0",quote:"多项定语语序的这种普遍性，尤其是修饰语后置的语言里多项定语的镜象排列，使我们相信其中的根本理据只能是距离象似动因。",zh:"镜象排列等普遍性使人相信根本理据只能是距离象似动因。"},
  vendler:{page:"8.0",quote:"这种解释早已为不少学者所提出，如Vendler(1968)，Martin(1968)都认为形容词定语的位置由它们与名词的相关程度决定，语义上越像名词的便越靠近名词中心语，Bever(1970)则明确提出这种语序是由认知策略决定的。",zh:"Vendler、Martin：形容词位置由与名词的相关程度决定；Bever：这种语序由认知策略决定。"},
  track:{page:"8.0",quote:"最先明确把汉语多项定语的语序与语言普遍现象联系起来考虑的是陆丙甫(1989，1992)，他用“轨层结构”的概念去概括这种普遍的语序现象，指出语义关系接近的成分其位置也比较靠近，这与认知的守恒性相关。",zh:"陆丙甫以“轨层结构”概括普遍语序现象：语义关系接近的成分位置也靠近，与认知守恒性相关。"},
  commonStrategy:{page:"8.0",quote:"汉语定中间de字的隐现规律和多项定语的排列规律由一条共同的认知策略所决定，它能为这两个独立现象表现出的一致性提供合理的解释。",zh:"de 字隐现与多项定语排列由一条共同认知策略决定，可解释两个独立现象的一致性。"},
  biggerQ:{page:"8.0",quote:"这给我们提出了一个更大的问题：自然语言的形式规则在多大程度上与认知策略相关？语言的共性规律又在多大程度上可从认知上得到解释？",zh:"更大的问题：形式规则在多大程度上与认知策略相关？共性规律在多大程度上可从认知上解释？"},
  deane:{page:"8.0",quote:"如本书上篇所述，近年来的认知语言学已开始试图回答这些问题，如Deane（1992)从“形式的空间化假设”出发为生成语法提出的多种普遍的句法限制和句法原则（如各种孤岛条件、X-bar原则等）找出认知上的基础，这就是很好的例子。",zh:"Deane 从形式的空间化假设出发，为生成语法的普遍句法限制找出认知基础。"},
  chineseSig:{page:"8.0",quote:"汉语作为一种缺乏形态，象似性较强的语言，对它的深入研究必将大大有助于人们对这些问题的探索。",zh:"汉语缺乏形态、象似性较强，深入研究它有助于探索形式规则与认知策略的关系。"}
};

/* ================= 基础工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const motionOK=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 角标编号 ================= */
const citeNo={};
(function numberCites(){
  $$(".cite").forEach(b=>{
    const id=b.dataset.cite;
    if(!citeNo[id]) citeNo[id]=Object.keys(citeNo).length+1;
    b.textContent=citeNo[id];
    if(!SOURCES[id]) b.title="缺出处："+id;
  });
})();

/* ================= 出处弹窗 ================= */
const citePop=$("#citePop");
let lastFocus=null;
function openCite(id){
  const s=SOURCES[id]; if(!s) return;
  $("#citeLoc").textContent="位置："+(s.ch||"第八章")+" · "+s.page+(s.page==="附注"||s.page==="封面"?"":" 节");
  $("#citeQuote").textContent="原文："+s.quote;
  $("#citeZh").textContent="转述："+s.zh;
  lastFocus=document.activeElement;
  citePop.hidden=false;
  $("#citeClose").focus();
}
function closeCite(){ citePop.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest(".cite");
  if(b){e.preventDefault();openCite(b.dataset.cite);}
});
$("#citeClose").addEventListener("click",closeCite);
citePop.addEventListener("click",e=>{if(e.target===citePop)closeCite();});

/* ================= 跳转与返回 ================= */
const backStack=[]; const backBtn=$("#backBtn");
function jumpTo(id){
  const el=document.getElementById(id); if(!el) return;
  backStack.push(scrollY);
  try{history.pushState({y:scrollY},"","#"+id);}catch(e){}
  el.scrollIntoView({behavior:motionOK()?"smooth":"auto",block:"start"});
  backBtn.classList.add("show");
}
function goBack(){
  const y=backStack.pop();
  if(y!=null) scrollTo({top:y,behavior:motionOK()?"smooth":"auto"});
  if(!backStack.length) backBtn.classList.remove("show");
}
backBtn.addEventListener("click",goBack);
addEventListener("popstate",e=>{
  if(e.state&&e.state.y!=null){backStack.pop();scrollTo({top:e.state.y,behavior:"auto"});}
  if(!backStack.length) backBtn.classList.remove("show");
});
$$("[data-jump]").forEach(b=>b.addEventListener("click",()=>jumpTo(b.dataset.jump)));

/* ================= 键盘 ================= */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!citePop.hidden){closeCite();return;}
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  const scenes=$$("[data-scene]");
  const cur=scenes.findIndex(s=>{const r=s.getBoundingClientRect();return r.top>=-80&&r.top<innerHeight*0.5;});
  if(e.key==="ArrowRight"&&cur<scenes.length-1){scenes[cur+1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
  if(e.key==="ArrowLeft"&&cur>0){scenes[cur-1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
});

/* ================= 主题与字号 ================= */
const themeBtn=$("#themeBtn");
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  store.set("np8theme",t||"auto");
  themeBtn.textContent=t==="dark"?"◑ 暗":t==="light"?"◑ 亮":"◐ 明暗";
}
applyTheme(store.get("np8theme")||"auto");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"auto";
  const dark=cur==="dark"||(cur==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(dark?"light":"dark");
});
const FS=[15.5,17,18.5,20];
let fsIdx=Number(store.get("np8fsIdx")||1);
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px");store.set("np8fsIdx",String(fsIdx));}
applyFs();
$("#fontDown").addEventListener("click",()=>{fsIdx=Math.max(0,fsIdx-1);applyFs();});
$("#fontUp").addEventListener("click",()=>{fsIdx=Math.min(FS.length-1,fsIdx+1);applyFs();});

/* ================= 阅读进度 ================= */
const resumePill=$("#resumePill"),resumeTxt=$("#resumeTxt");
let saveT=null;
addEventListener("scroll",()=>{
  if(saveT) return;
  saveT=setTimeout(()=>{
    saveT=null;
    const scenes=$$("[data-scene],[data-quiz],[data-hero]");
    let cur=scenes[0];
    for(const s of scenes){if(s.getBoundingClientRect().top<120) cur=s;}
    store.set("np8progress",JSON.stringify({id:cur.id,y:Math.round(scrollY)}));
  },400);
},{passive:true});
(function initProg(){

/* ================= 通用点选展开 ================= */
function bindPick(listSel,attr,boxSel,txtSel,table){
  const box=$(boxSel),txt=$(txtSel),list=$(listSel);
  if(!box||!txt||!list) return;
  $$(".btn",list).forEach(b=>b.addEventListener("click",()=>{
    const k=b.getAttribute("data-"+attr);
    if(!Object.prototype.hasOwnProperty.call(table,k)) return;
    txt.textContent=table[k];
    box.hidden=false;
    box.classList.remove("wrong");
    $$(".btn",list).forEach(x=>x.classList.toggle("sel",x===b));
  }));
}
