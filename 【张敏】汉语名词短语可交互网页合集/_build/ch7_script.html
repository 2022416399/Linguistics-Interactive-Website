<script>
"use strict";
/* ================= 事实账本（出处库） ================= */
const SOURCES = {
  bookInfo:{ch:"第七章",page:"封面",quote:"认知语言学与汉语名词短语 ＞ 作者：张敏",zh:"《认知语言学与汉语名词短语》（张敏 著）第七章"},
  surprise:{page:"7.3",quote:"我们可以肯定地说，汉语领属结构中de字的隐现规律绝不是语言普遍现象的一个“令人困惑的例外”，相反，它是普遍的距离象似原则的一个“令人惊喜的证实”。",zh:"汉语领属结构 de 字隐现不是普遍现象的例外，而是距离象似原则的证实。"},
  continuum:{page:"7.0",quote:"实际上，从原型的领属构造到原型的属性构造可看作一个连续统，领属构造的 N1 部分及整个构造越是带非单指意义，它偏离原型的程度就越高，离属性结构就越近，隐去de的能力就越大。",zh:"从原型领属到原型属性是一个连续统：越带非单指意义，越接近属性结构，隐去 de 的能力越大。"},
  possDef:{page:"7.0",quote:"(1)a)领有者 p1 为有生物，通常是人，更为原型的是第一人称的自我(ego); b) 被领有者 p2 是可感知的、看得见的具体事物； c) p1 是主动的，p2 是被动的，这体现在：c1) p2 受到 p1 的支配和控制，c2) 领有关系是独占的，不与他人共有",zh:"原型领属关系三条件：领有者为有生物（原型为第一人称自我）、被领有者为可感知的具体事物、领有者主动支配且独占。"},
  refGeneric:{page:"7.0",quote:"由 c2) 可推知，原型的 p2 本身应为类指的 (generic)，在语境中它自然常表单指，但其单指并非直接实现的，而是通过从类指定下的类中挑出一个的方式来实现的，故它一般由普通名词(common noun)表达，试比较“张三(单指名词)的儿子(类指名词)？张三的小宝(单指名词)”。",zh:"原型 p₂ 应作类指理解，其单指通过从类中挑出一个例来实现，故由普通名词表达。"},
  whyNoDe:{page:"7.0",quote:"这一区别从另一个角度很好地说明了原型的领属定语不能隐去de的原因：前面说过，DN本质上是类名，D为规约的分类指标，而原型的领属定语的限定作用是将中心语的所指确定为一个例而不是一个类，它在本质上和类指不相配。",zh:"原型领属定语把所指确定为一个例而非一个类，与类指不相配，故不能隐去 de。"},
  bodyEx:{page:"7.1.1",quote:"(1)张三的鼻子|李四的脑袋|老刘的耳朵|小王的眼睛|铁蛋儿的屁股|黛玉的眼泪 (2)a. 洋人的鼻子|孩子的脑袋|聋子的耳朵|姑娘的眼睛|孩子的屁股|女人的眼泪 b. 狗的鼻子|老鹰的翅膀|狼的牙齿|山羊的犄角|狗熊的爪子|松树的根|柳树的叶子 (3)牛(的)鼻子|象(的)鼻子|猪(的)脑袋|猪(的)耳朵|金鱼(的)眼睛|猴子(的)屁股|鳄鱼(的)眼泪|猫(的)尾巴|乌龟(的)壳|鸡蛋(的)黄儿|花生(的)壳",zh:"身体部位领属的三组例子：(1)(2) 的 de 必须出现，(3) 的 de 可以隐去。"},
  twoLimit:{page:"7.1.1",quote:"汉语里用“DdeN”形式表达的限定关系其实可分为“类指限定”和“单指限定”两种。……而当D是只能表单指的专名时，其作用是单指限定，或说是对单一指称的“确认”(identification)，即在中心语所代表的类中确认出一个特定的例来作为指示的对象。我们可以把这种D称为“确认指标”。",zh:"D de N 分两类限定：类指限定（D 是分类指标）与单指限定（D 是确认指标）。"},
  attributive:{page:"7.1.1",quote:"这时的 N1 与其说是 N2 的领属者，不如说更像其一种分类的属性，某些形式还产生了特别的意义，如“金鱼眼睛|鳄鱼眼泪”等，这里的 N1 就完全应该看成一种属性了。换言之，(3)中不带 de 的形式大都是固定的类名",zh:"(3) 中不带 de 的形式里 N₁ 更像属性而非领属者，整个形式是固定的类名。"},
  salience:{page:"7.1.1",quote:"至于不能食、用者，带de与否也多半决定于认知上显著性的高低。拿“尾巴”和“鼻子”相比，前者在人们感知动物的整体轮廓时显著性更高，故能相当自由地与动物名构成DN……其中只有“牛”和“象”能不带de修饰“鼻子”",zh:"尾巴感知显著性高，可自由构成 DN；鼻子显著性低，只有牛、象例外。"},
  kinEx:{page:"7.1.2",quote:"(4)张三的哥哥|宝钗的妈|王贵的媳妇儿|李四的亲戚|小王的导师|老刘的邻居|宋江的朋友 (5)孩子的老师|同学的同学|主任的儿子|爸爸的同事|邻居的女儿|朋友的太太|首长的秘书 (6)干部(的)子女|贵族(的)后裔|烈士(的)后代|军人(的)家属|博士生(的)导师|学生(的)家长",zh:"人际关系领属三组：(4) 专名须带 de；(5) 通名但非规约类，须带 de；(6) 规约类，de 可隐去。"},
  objEx:{page:"7.1.3",quote:"(7) 李四的信 | 鲁迅的照片 | 学生的论文 | 张三的衣服 | 老师的收入 | 赵七的财产 | 老刘的手表 (8)名人(的)书信|明星(的)照片|研究生(的)论文|儿童(的)服装|职工(的)收入|国家(的)财产 (9)曹雪芹的成就|宝玉的性格|黛玉的形象|张三的利益|红楼梦的风格|水浒的情节 (10)个人(的)成就|人物(的)性格|人物(的)形象|群众(的)利益|作品(的)风格|故事(的)情节",zh:"具体物品与抽象物的领属：(7)(9) 专名须带 de；(8)(10) 规约类可隐去 de，如“研究生论文”是而“学生论文”非。"},
  belongEx:{page:"7.1.4",quote:"(11) 中文系(的)学生 | 陆军(的)军官 | 大学(的)教师 | 邮局(的)职工 | 工会(的)会员 | 语文组(的)教员 | 教研室(的)主任 (12)上海(的)居民|北大(的)学生|北大(的)校长|英国(的)女王|美国(的)总统|137师(的)师长",zh:"归属类领属：p₁ 表 p₂ 的归属，可作规约分类指标，故 de 可隐去。"},
  wholeClass:{page:"7.1.4",quote:"其实，更为关键的因素在于 p1 和 p2 组合而成的整体是否具有规约的别类性。……一般来说，若 p1 也是可表类的通名时，满足这一要求的可能性比 p1 为专名时要大得多，如“中文系（的）学生”可规约地指称一类学生，而“老张的学生”则不能。",zh:"关键在整体有无规约的别类性；“老张的学生”不能隐 de 不是因为 p₁ 是专名，而是整体不成规约类。"},
  nonEntity:{page:"7.1.4",quote:"印度音乐是音乐的一种，庄子哲学也是哲学的一种。不过，爱因斯坦相对论不好说成是相对论的一种，我们只能勉强说它是物理理论的一种，名叫相对论，由其创始人爱因斯坦充任其确认指标。类似的例子还有“北大(的)西门(颐和园(的)北门(故宫(的)正门”",zh:"“爱因斯坦相对论”“北大西门”由单指形式直接作出规约确认，类似专名。"},
  spaceEx:{page:"7.1.5",quote:"(16) 桌子（的）上面 | 院子（的）中间 | 盒子（的）里面 | 村子（的）左边 | 广场（的）北边 | 讲台（的）前面 | 学校（的）四周 | 北京（的）南边 | 张三（的）后边 | 弟弟（的）脸上 | 主任（的）手里 | 孩子（的）身上",zh:"空间定位构造中 de 以不出现为常，其理据与前面一致。"},
  hsiehTai:{page:"7.1.5",quote:"正如Hsieh（1989）和Tai（1993）所指出的，用领属关系（或曰整体-部分关系）的图式来编码空间关系是汉语的一个很重要的特点。实体可以在物理—心理意义上领有另一个实体，而空间并非实体，空间和实体之间自然不可能建立真正的领有关系。不过我们认为，汉语可以用隐喻的方式让实体领有空间，也让空间领有实体。",zh:"汉语以领属图式隐喻编码空间关系：实体可领有空间，空间也可领有实体。"},
  metaphor:{page:"7.1.5",quote:"(17) 原型的领属关系可蕴含下列两类关系: a) 包含关系, 即某些领有物被领有者所包含, 如 “我的手 | 我的想法”; b) 邻接关系, 即某些领有物在物理上或心理上与其领有者相邻并有经常的接触, 如 “我的衣服 | 我的哥哥”。",zh:"隐喻的理据：原型领属蕴含包含关系与邻接关系。"},
  twoLayer:{page:"7.1.5",quote:"我们将这种看法作进一步的引申，即把这三种东西的相互关系看作两层领属关系，即 [R0 P S] P F0。",zh:"空间定位含两层隐喻领属关系：[参照物 P 空间] P 焦点物。"},
  spaceWhy:{page:"7.1.5",quote:"(16)及(18a)里作为领有者的实体 R0 一定和它们所领有的空间S紧密邻接，这种邻接关系的紧密程度超过了任何一种其他关系。……“张三的手/父亲/书”中的de不可隐去的原因不在于领有者和领有物的关系不够紧密，而如前节所述，在于隐去de的构造若表实体，这实体须构成一个规约的类。",zh:"实体与邻接空间紧密到不可分离，且中心语是空间而非实体，不受类名限制，故可隐去 de。"},
  timeEx:{page:"7.1.5",quote:"(21)昨天(的)上午|明天(的)晚上|星期天(的)白天|明年(的)春季|去年(的)春节|90年(的)2月|95年(的)年底|12月(的)31号|19世纪(的)上半叶|明朝(的)末年",zh:"时间定位构造 de 也以不出现为常，理据与空间定位平行：整体与部分不可割舍。"},
  typology:{page:"7.1.5",quote:"世界上几乎所以语言里的所属关系和空间定位关系的编码形式都有相通之处(Ultan 1978)，这恐怕不是偶然的。Clark(1978)对无亲属关系的30种语言的抽样考察充分显示了这一点。……在那些从形式上区分可让渡(可分离)与不可让渡(不可分离)领属关系的语言里，将空间定位(spatial orientation)关系用不可让渡形式编码的语言比率相当高。",zh:"类型学证据：几乎所有语言的所属关系与空间定位编码形式相通；空间定位多用不可让渡形式编码。"},
  demEx:{page:"7.2.1",quote:"(22)谁的哥哥|这样的人|怎么样的人|这里的书|那儿的情况|哪儿的人 (23) 这个学生 | 那家伙 | 这话 | 这些同学 | 这件事情 | 哪个同学 | 哪本书 | 什么人 | 什么东西 | 什么事",zh:"指示、疑问代词作定语：(22) 必须带 de，(23) 一般不带 de。"},
  deictic:{page:"7.2.1",quote:"至于“这那(哪)”，似乎还没有人问过表指示的这类代词为什么不带de，大概觉得这是纯句法的限制，但我们相信其中一定有某种理据，因为所有已知语言里的这类指示成分和实体词的结合都相当紧密。",zh:"指示代词不带 de 有认知理据：所有已知语言里指示成分与实体词结合都相当紧密。"},
  russell:{page:"7.2.1",quote:"专名在指称上的这种“非直指”“非亲知的性质使得罗素认为它们不是真正的专名，而是有定章状词的伪装形式或缩写(Russell 1956)，如“苏格拉底”实际上是“柏拉图的老师”“喝毒酒而死的哲学家”等摹状词的缩写；而真正的专名（他称为“逻辑专名 logically proper name”）应是“这”和“那”之类的成分，它们没有任何描述功能，只有指示功能",zh:"罗素：专名是摹状词的缩写；真正的专名是“这”“那”，只有指示功能。"},
  pnNature:{page:"7.2.2",quote:"PN结构的表层语义关系是指别，而非领属。……“我哥哥”则类似“这个人”，其中“我”的表层语义脚色不是领有者，而是类似“这/那”的指别者，整个结构是在一个关系的框架中，用“我”作为确认指标，将所指确定为某个单称的实体。",zh:"PN 的表层语义是指别而非领属：“我哥哥”类似“这个人”。"},
  logicName:{page:"7.2.2",quote:"PN 结构在指称方面类似表单指的专名，我们可以借用罗素的概念，称它们为“逻辑专名”，或反罗素之道而称之为“伪装的、扩展的专名”。它们披上了摹状词的伪装，但在指称的实质上相当于专名。",zh:"PN 是“逻辑专名”或“伪装的、扩展的专名”：披摹状词之伪装，实质相当于专名。"},
  pnWhy:{page:"7.2.3",quote:"我们认为这不是由纯粹的句法限制决定的，其中必有认知理据，且其理据与 PN 结构本身的语义特性有关，前者可从后者推导而出。",zh:"PN 的构成限制可从 PN 的语义特性推导而出。"},
  threeWays:{page:"7.2.3",quote:"第Ⅰ种是专名和罗素所说的“逻辑专名”的指称方式……第Ⅱ种是通名及一般的DN构造的指称方式……第Ⅲ种是指量定中结构（如“这个人”）和PN的指称方式，它们和专名的相同之处在于都是直接指称单个的实体，不同之处在于专名一般没有“类”的蕴含，而指量定中结构和PN结构则是以从类中直接挑出一个例的方式来指称个体。",zh:"指称单个实体的三种方式：直接指称（专名）、经类指称（通名）、从类中挑出例（指量结构与 PN）。"},
  properName:{page:"7.2.3",quote:"我们说“我哥哥|我们学校”，因为“我哥哥”指张三，“我们学校”指北人；我们不说“我手|我钢笔”，因为我的手或我的钢笔虽然一定有不同于其他人的手或钢笔的地方，但这类个体差异并没有重要或显著到能被人规约地意识到，并可以用独一无二的专名去指称的地步。",zh:"能否形成 PN 的首要条件是实体可否有专名：人有专名，手和钢笔没有。"},
  bidir:{page:"7.2.3",quote:"由于双向领属关系体现在一个结构中，它代表了两种关系的所指的交集，因此在指称上比单一关系的所指要确定得多，因而可以靠“我们”这样的确认指标去标明其特定的所指。这样，学生的口里便可以有“我们学校|我们楼”的说法，没有“我们图书馆|我们教室”的说法。",zh:"双向领属关系代表两种关系所指的交集，指称更确定，故有“我们学校”而无“我们图书馆”。"},
  egoCenter:{page:"7.2.3",quote:"当前指示是以“我(ego)”作为中心的，“我”一定是特定的话语情景中最为确定的指称。没想“我”名叫张三，在某个言谈行为中“我”要提及自己的哥哥，若用“张三的哥哥”，听者要了解这一指称，需完成两个步骤……若用“我(的)哥哥”，听者无需经过第一个步骤就可直接理解整个构造的所指。",zh:"人称代词定语以自我中心为基础，是更直接的指称方式。"},
  silverstein:{page:"7.2.3",quote:"Silverstein（1976）提出过一个著名的NP语义层级体系……Deane（1992）注意到，英语里的两种属构造，即领属词前置和领属者后置的构造的合格程度因表领有者的NP在上述层级上的位置而有所不同。……英语里领属结构的形式距离越小，其确指性越强，而处于自我中心层级最顶端的人称代词，其与中心语的形式距离最小。",zh:"Silverstein 层级与 Deane 的英语观察：形式距离越小确指性越强，与汉语相互印证。"},
  typology2:{page:"7.3",quote:"萨丕尔曾精辟地指出，“我的爸爸”和“我的手|我的帽子”在本质上是不同的，前者只是代表我和另一个人的某种关系，不是真正的领有，后者才是实在的独占性的领有……汉语和上述第2类语言有着惊人的相似之处。举一个明显的例子，加州的Konkow语里的不可让渡领属形式中的 p2 全部为亲属词及其他几个人际关系词",zh:"类型学共相：亲属关系词比身体部位词更常用不可让渡（结合紧密）形式编码，汉语与 Takelma 类语言相似。"},
  compound:{page:"7.3",quote:"(1)“汉语复合名词假说”：汉语里以名词为中心语的构造，若其修饰语是后面不带“的”的名词、区别词、形容词或动词，则这个构造是一个复合名词(nominal compound)。",zh:"汉语复合名词假说：不带 de 的定中构造是复合名词，意义上也相当于单个名词。"}
};

/* ================= 基础工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const motionOK=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 角标编号 ================= */
const citeNo={};
(function numberCites(){
  $$(".cite").forEach(b=>{
    const id=b.dataset.cite;
    if(!citeNo[id]) citeNo[id]=Object.keys(citeNo).length+1;
    b.textContent=citeNo[id];
    if(!SOURCES[id]) b.title="缺出处："+id;
  });
})();

/* ================= 出处弹窗 ================= */
const citePop=$("#citePop");
let lastFocus=null;
function openCite(id){
  const s=SOURCES[id]; if(!s) return;
  $("#citeLoc").textContent="位置："+(s.ch||"第七章")+" · "+s.page+(s.page==="附注"||s.page==="封面"?"":" 节");
  $("#citeQuote").textContent="原文："+s.quote;
  $("#citeZh").textContent="转述："+s.zh;
  lastFocus=document.activeElement;
  citePop.hidden=false;
  $("#citeClose").focus();
}
function closeCite(){ citePop.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest(".cite");
  if(b){e.preventDefault();openCite(b.dataset.cite);}
});
$("#citeClose").addEventListener("click",closeCite);
citePop.addEventListener("click",e=>{if(e.target===citePop)closeCite();});

/* ================= 跳转与返回 ================= */
const backStack=[]; const backBtn=$("#backBtn");
function jumpTo(id){
  const el=document.getElementById(id); if(!el) return;
  backStack.push(scrollY);
  try{history.pushState({y:scrollY},"","#"+id);}catch(e){}
  el.scrollIntoView({behavior:motionOK()?"smooth":"auto",block:"start"});
  backBtn.classList.add("show");
}
function goBack(){
  const y=backStack.pop();
  if(y!=null) scrollTo({top:y,behavior:motionOK()?"smooth":"auto"});
  if(!backStack.length) backBtn.classList.remove("show");
}
backBtn.addEventListener("click",goBack);
addEventListener("popstate",e=>{
  if(e.state&&e.state.y!=null){backStack.pop();scrollTo({top:e.state.y,behavior:"auto"});}
  if(!backStack.length) backBtn.classList.remove("show");
});
$$("[data-jump]").forEach(b=>b.addEventListener("click",()=>jumpTo(b.dataset.jump)));

/* ================= 键盘 ================= */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!citePop.hidden){closeCite();return;}
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  const scenes=$$("[data-scene]");
  const cur=scenes.findIndex(s=>{const r=s.getBoundingClientRect();return r.top>=-80&&r.top<innerHeight*0.5;});
  if(e.key==="ArrowRight"&&cur<scenes.length-1){scenes[cur+1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
  if(e.key==="ArrowLeft"&&cur>0){scenes[cur-1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
});

/* ================= 主题与字号 ================= */
const themeBtn=$("#themeBtn");
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  store.set("np7theme",t||"auto");
  themeBtn.textContent=t==="dark"?"◑ 暗":t==="light"?"◑ 亮":"◐ 明暗";
}
applyTheme(store.get("np7theme")||"auto");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"auto";
  const dark=cur==="dark"||(cur==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(dark?"light":"dark");
});
const FS=[15.5,17,18.5,20];
let fsIdx=Number(store.get("np7fsIdx")||1);
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px");store.set("np7fsIdx",String(fsIdx));}
applyFs();
$("#fontDown").addEventListener("click",()=>{fsIdx=Math.max(0,fsIdx-1);applyFs();});
$("#fontUp").addEventListener("click",()=>{fsIdx=Math.min(FS.length-1,fsIdx+1);applyFs();});

/* ================= 阅读进度 ================= */
const resumePill=$("#resumePill"),resumeTxt=$("#resumeTxt");
let saveT=null;
addEventListener("scroll",()=>{
  if(saveT) return;
  saveT=setTimeout(()=>{
    saveT=null;
    const scenes=$$("[data-scene],[data-quiz],[data-hero]");
    let cur=scenes[0];
    for(const s of scenes){if(s.getBoundingClientRect().top<120) cur=s;}
    store.set("np7progress",JSON.stringify({id:cur.id,y:Math.round(scrollY)}));
  },400);
},{passive:true});
(function initProg(){
  let p=null;try{p=JSON.parse(store.get("np7progress")||"null");}catch(e){}
  if(p&&p.id&&scrollY<40){
    const el=document.getElementById(p.id);
    if(el){
      const h2=el.querySelector("h2");
      resumeTxt.textContent=h2?h2.textContent.replace(/^\s+/,""):"上次位置";
      resumePill.hidden=false;
      resumePill.onclick=()=>{resumePill.hidden=true;scrollTo({top:p.y,behavior:motionOK()?"smooth":"auto"});};
    }
  }
})();

/* ================= 通用点选展开 ================= */
function bindPick(listSel,attr,boxSel,txtSel,table){
  const box=$(boxSel),txt=$(txtSel),list=$(listSel);
  if(!box||!txt||!list) return;
  $$(".btn",list).forEach(b=>b.addEventListener("click",()=>{
    const k=b.getAttribute("data-"+attr);
    if(!Object.prototype.hasOwnProperty.call(table,k)) return;
    txt.textContent=table[k];
    box.hidden=false;
    box.classList.remove("wrong");
    $$(".btn",list).forEach(x=>x.classList.toggle("sel",x===b));
  }));
}

     no:'<span class="v-no">✗ 再想想。</span>正解是 a。Haiman 的不可让渡等级序列需要修正，汉语并非 Greenberg (9) 的反例。'}
  ];
  QA.forEach(q=>{
    const row=$("#q"+q.n);
    if(!row) return;
    const fb=$("#q"+q.n+"fb");
    $$(".btn",row).forEach(b=>b.addEventListener("click",()=>{
      if(row.dataset.done) return;
      row.dataset.done="1";
      const ok=b.dataset.q==="a";
      b.classList.add(ok?"sel":"wrong");
      fb.innerHTML=ok?q.ok:q.no;
      $$(".btn",row).forEach(x=>{x.disabled=true;});
    }));
  });
})();
</script>
