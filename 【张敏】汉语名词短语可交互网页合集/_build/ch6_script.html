<script>
"use strict";
/* ================= 事实账本（出处库） ================= */
const SOURCES = {
  bookInfo:{ch:"第六章",page:"封面",quote:"认知语言学与汉语名词短语 ＞ 作者：张敏",zh:"《认知语言学与汉语名词短语》（张敏 著）第六章"},
  fanQuestion:{page:"6.1",quote:"本章旨在探讨范继淹（1958）提出的一个经典问题，即定中间de字的隐现条件。这是汉语语法学界的一个老大难问题，因为其中涉及的因素太多，除句法因素外还有非句法的音节、语体、语义、语用等因素",zh:"本章要解决范继淹（1958）提出的经典问题：定中间 de 字何时隐、何时现。"},
  threeCond:{page:"6.1.2",quote:"在上述认识的基础上，我们提出以下三条层层蕴含的语义限制来概括de字隐现的一般规律。",zh:"三条层层蕴含的语义限制：属性条件、分类属性条件、规约分类属性条件。"},
  seilerCont:{page:"6.1.1",quote:"Seiler认为限定作用实际上是一个连续统，其两端分别是“确定指称”和“刻划概念”，它们代表了相反的两种趋向，各种类别的D就分布在这个连续统的不同位置",zh:"限定作用是一个连续统，两端分别是“确定指称”与“刻划概念”。"},
  twoFunc:{page:"6.1.1",quote:"D在名词短语中的作用可分为两个类型，即确定指称（specifying a reference）和刻划概念（characterizing a concept），前者的功能是确定指称的对象，因而它主要作用于中心语概念的外延，不会或较少对中心语概念的内涵有影响；后者的功能是增加概念的内容，它主要作用于概念的内涵。",zh:"确定指称作用于外延，刻划概念作用于内涵；刘月华理解的“限制性”主要指前者，朱德熙强调的是后者。"},
  seqRight:{page:"6.1.1",quote:"(2)汉语限定序列（右半部分）",zh:"转折点右侧的汉语限定序列，用来描述定语语序。"},
  cnSeq:{page:"6.1.1",quote:"尽管(1)呈现的限定序列具有一定的普遍性，但它毕竟是以印欧语为主要依据提出来的。结合汉语里的具体情况，我们将转折点右侧的序列重新界定如下：",zh:"以印欧语为依据的限定序列还须结合汉语重新界定。"},
  turnPoint:{page:"6.1.1",quote:"Seiler从德语出发将转折点放在“冠词、领属语”处，我们认为，从Hawkins(1983)给出的类型学证据看，这个转折点应放在“数词”处。",zh:"本书主张把转折点放在“数词”处，左边是确定指称的类，右边是刻划概念的类。"},
  dxnForce:{page:"6.1.1",quote:"定语中含有转折点左端成分的定中结构在汉语里必须是中间有分隔物的DxN，其中的 x 的出现是强制性的，它要么是 de（如“他的书”），要么是量词（如“一本书、这本书”），只有由逻辑量词（如“一切、所有、任何”等）充任的定语除外。",zh:"定语含转折点左端成分时，DxN 中的分隔物 x（de 或量词）强制出现。"},
  mergeTrend:{page:"6.1.1",quote:"在包括印欧语在内的许多语言里普遍存在着这样的趋势，即越靠近限定序列右端的定语往往就越有潜力和中心语名词融合起来成为一个复合名词。",zh:"越靠近限定序列右端的定语越有潜力与中心语融合为复合名词。"},
  jiaFormat:{page:"6.1.2",quote:"在前一章谈到的三类定中结构中，乙式中的 de 必须出现，故不存在 de 字的隐现条件问题，我们要探讨的实际上是甲 1 甲 2 两式的形成条件。",zh:"de 字隐现问题实质上是甲₁、甲₂ 两式的形成条件问题。"},
  deForeground:{page:"6.1.2",quote:"de 作为定中之间的标记成分，其语义作用是将D对N的分类意义置于前景；隐去de，则D的分类意义就隐入背景。",zh:"de 将 D 的分类意义置于前景，隐去 de 则使其隐入背景。"},
  condWhy:{page:"6.1.2",quote:"我们用“可能性”来描述 de 字隐现（即 DN 是否能成立）的规律，这是出于两个方面的理由。第一，上述规律在本质上作为语义限制，只是反映了一定的概念结构内de字倾向于出现或不出现的大致趋势，不能据以作出绝对的预测。",zh:"用“可能性”而非“必然”描述规律的两个理由。"},
  condImply:{page:"6.1.2",quote:"(3) 里的三个限制条件中，(c) 蕴含了 (b)，(b) 蕴含了 (a)，故严格地看只需要 (c) 就够了，它大致可说是 DN 得以成立的充分必要条件。",zh:"(c) 蕴含 (b)，(b) 蕴含 (a)；分列三项是为了作否定性预测。"},
  shenJia:{page:"6.1.2",quote:"沈家煊 (1997) 就觉得朱德熙 (1956) 认为不能说的“重箱子、凉脸、白手”在特定的说话环境里是可以成立的，之所以平常不大说这些形式，是因为“我们通常按……给……分类而不按……给……分类”",zh:"沈家煊指出这类 DN 可在特定场景中成立；本书用三条限制说明其临时满足 (b)(c) 的机制。"},
  qbDef:{page:"6.2",quote:"其实话应该倒过来讲，因为区别词本身就是由“只能在名词或‘的’前面出现”这一特征定义出来的类（朱德熙 1982）。",zh:"区别词由“只能在名词或‘的’前出现”这一特征定义出来。"},
  qbAlways:{page:"6.2",quote:"而由区别词构成的 DdN，除了极少数例外（如“心爱的 N”），都能隐去 de 形成 DN，而且这类词做定语以不带 de 为常（参见吕叔湘，饶长溶 1981）。",zh:"区别词构成的 DdN 几乎都能隐去 de 形成 DN，且以不带 de 为常。"},
  qbMotive:{page:"6.2",quote:"从认知语言学的角度看，我们认为区别词在语法功能上的所有特点都可以从整体上由其意义特点推导出来，其中的动因是十分明显的：它在概念上位于限定序列的最右端。",zh:"区别词的句法特点可由其意义推导：它在概念上位于限定序列最右端。"},
  qbName:{page:"6.2",quote:"吕叔湘、饶长溶(1981)把这类词称作非谓形容词、属性词，朱德熙(1982)称之为区别词，这些名称分别显示了它们在句法功能、语义特性和语义作用方面的特点。",zh:"三个名称分别突出其句法功能、语义特性和语义作用。"},
  qbSix:{page:"6.2",quote:"（1）式样型号：男式衬衫|微型电机|重型机械|大号皮鞋|罐装啤酒|大陆性气候|填鸭式教学 品级等第：甲级公路|上等木材|高等数学|特级教师|同等学历|劣等产品|副主任 用途功能：内服药物|日用商品|家用电器|公共厕所|军用物资|保健器材|排灌机械 颜色外观：彩色电视|茶色玻璃|藏青棉袄|草绿军装|大红灯笼|多边形|印花毛巾 材料质地：呢大衣|绸衬衫|金首饰|银镯子|钢化玻璃|混纺布料|搪瓷茶杯|夹馅饼干 其他属性：母老虎|双眼皮|女教师|多元种族|立体电影|长途电话|活期户头|人造卫星|现任总统|慢性肝炎|中性反应|国产汽车|袖珍字典|自动步枪|远房亲戚",zh:"区别词的六个语义类及其例子。"},
  qbClass:{page:"6.2",quote:"区别词往往表示界限明确的属性，往往是成对的或成组的，如“正一副|西式一中式|低频—高频|同步—异步”，这显示它们本质上就有明显的分类作用。这使得以区别词为定语的DN构造成为最具原型性的类名。",zh:"区别词成对成组，本质上有明显的分类作用，其 DN 是最具原型性的类名。"},
  qbTerm:{page:"6.2",quote:"正如吕叔湘(1979)所说，“由于现代科学、技术的发展，这类词正在每日每时地大量产生”。科技术语正是对有关概念进行严格、精密，同时规约性最强的分类，这使得新兴的分类性专门术语(往往译自外语)经常采用区别词的形式，如“多媒体(multimedia)超高频(UHF)高密度(high-density)”。",zh:"科技术语规约性最强，新兴分类性术语常采用区别词形式。"},
  qbPred:{page:"6.2",quote:"吕叔湘-饶长溶（1981）将区别词称为“非谓形容词”，因为它完全不能独立作谓语。区别词的这种句法性质正好印证了我们对 DN 构造的分析。",zh:"区别词完全不能独立作谓语，与其强称谓性、弱述谓性互补。"},
  lv65:{page:"6.3.1",quote:"吕叔湘(1965)根据对1400个形容词用例的考察得出的结论是：“单音形容词不带de为多，带de是例外。双音形容词带de为多，但是不带de的也常见。带de不带de有时候好像很随便。”",zh:"吕叔湘 1400 例考察的结论：单音形容词不带 de 为多。"},
  typeToken:{page:"6.3.1",quote:"必须首先作以下两种区分：一是区分有关“类(type)”的总的趋势和有关“例(token)”的个别条件；一是区分原型类和非原型类。",zh:"先区分类的趋势与例的条件、原型类与非原型类。"},
  monoClass:{page:"6.3.1",quote:"下面我们参照吕叔湘（1966）的分法，根据单音形容词直接做定语的能力，将它们分为三类来考察：1）“无能的”，即跟任何N都无法构成DN结构的，2)“有能的”，即能跟某些N构成DN结构，但有较大限制的。3)“全能的”，即能相当自由地构成DN的。",zh:"单音形容词按直接作定语的能力分为无能、有能、全能三类。"},
  class1:{page:"6.3.2",quote:"6.3.2. 第1类的例子非常少，主要有：(1)对|够|行|悬(险)|诡(鬼)|呆|逗|差|妥|稳|抠|牢|紧|松|勾|忙|乏|累|困痒|渴|干|疼|麻|饱|饿|烦|慌|冷|远|近|迟|顺|活|静|久|准|广|灵|散",zh:"第 1 类“无能”单音形容词的词表。"},
  class1Sem:{page:"6.3.2",quote:"具体看，这些词与其说明对象之间的语义联系包括：(a)表对特定的而非一般的事件、行为或实体的主观评价或判断，如“对|妥|行|准”；(b)表实体在特定场合里出现的临时状况，如“牢|匀|稳”；(c)表临时性的身体、心理感觉，如“渴|累|烦|慌”；(d)表对时间延续或空间距离的主观判断，如“远|近|久|迟”，等等。",zh:"第 1 类形容词的四种语义联系：主观评价、临时状况、临时身心感觉、时空主观判断。"},
  hungryGhost:{page:"6.3.2",quote:"有意思的是，(1)中有些形式能出现在DN式复合词中，如“饿鬼|饿汉|饱汉|大忙人”，这时其中的“饿|饱|忙”表示的不再是特定场合里出现的临时状况，它们在意念上已成为中心语非常本质的特征了（如“饿鬼”就是以“饿”为其基本特征的“鬼”）。",zh:"“饿鬼、大忙人”中这些临时性形容词已成中心语的本质特征——形式与意义的又一重平行。"},
  predAdj:{page:"6.3.2",quote:"这些词还有一个特点值得注意，即它们的主要句法功能是作谓语（参见张宝林1996），故赵元任(1968)把这类词称作“谓语性形容词”(predicative adjectives)，吕叔湘(1979)称之为“唯谓形容词”。",zh:"第 1 类形容词主要作谓语，与区别词（非谓形容词）形成绝妙反衬。"},
  zhu56Sel:{page:"6.3.3",quote:"朱德熙(1956)举了不少例子说明这种选择限制，如“贵东西—贵手绢|脏衣服—脏糖|凉水—凉脸|黄制服—黄汽船|薄纸—薄灰尘|重担子—重箱子”等。",zh:"第 2 类单音形容词与名词的选择限制，句法和音节条件相同，问题出在认知—语义。"},
  fiveFormats:{page:"6.3.3",quote:"上面的例子包含了五种意义相关的格式。(a)(b)(c)式中的形容词性成分表事物的属性并都带有分类意味，但其分类意味并不相同。……(d)(e)式则含有形容词的复杂形式，它们都表情状，带描述意味。从左到右，我们可观察到这样一个蕴含序列：左边能成立的，右边往往也能成立；右边能成立的，左边却不一定能成立。DN式是最靠左的形式，故限制最强。",zh:"五种格式的蕴含序列：DN 限制最强，越往右限制越松。"},
  thickPaper:{page:"6.3.3",quote:"第一个条件要求D在汉语里必须能感知为N的一个相对稳固的品质而非临时的状态，其作用可从例(6)(7)的对比中看出。纸的厚薄是纸本身稳固的属性，而雪的厚薄只是因下雪时间长短、降水量多少等因素而导致的临时性的状态",zh:"条件 (a) 属性条件：厚纸能说而厚雪不能说，因为雪的厚薄是临时状态。"},
  blueInk:{page:"6.3.3",quote:"第二个条件的作用可以从(4)(5)的比较中看得很清楚。……这一限制还可以解释朱德熙、吕叔湘提出的这样一些例子：(9)蓝墨水：蓝天空|绿绸子：绿庄稼|冬天冷：冷冬天|海水咸：咸海水",zh:"条件 (b) 分类属性条件：圆地球不能说，因为独一无二者无法据以分次类。"},
  thirdCond:{page:"6.3.3",quote:"汉语里不能成立的DN组合，大多数问题都出在第三个条件上，即难以满足最严格的“规约分类属性”的限制。如例（2）（3）所示，“手”和“糖”都可以有“脏”的属性，都可出现在分类性的DdN构造里，但这一属性作为分类指标只是在和前者共现时才能被进一步规约化",zh:"条件 (c) 规约分类属性条件：脏手有而脏糖无，规约与否是“约定俗成”的。"},
  freezes:{page:"6.3.3",quote:"对熟语性组合的研究恰好是认知语言学的一个特长。自从Cooper & Ross(1975)提出所谓“语言凝结体(linguistic freezes)”的概念以来，这方面的研究成果甚丰，它们显示熟语性组合之下往往存在着认知上的理据(参见Landsberg 1995)。",zh:"语言凝结体研究显示：熟语性组合之下往往存在认知理据。"},
  icmPoints:{page:"6.3.3",quote:"(10)i. 某事物 N 的属性 D 在相关概念结构中的地位取决于认知者（说话人）与此事物互动行为的模式；ii. 互动行为的模式可用特定的 ICM 描述；ii. 能够形成 DN 的属性 D 必须是特定 ICM 里与互动行为相关的显著属性，或曰显著的互动属性 (salient interactional properties)",zh:"ICM 分析三要点：属性地位取决于互动行为模式，模式可用 ICM 描述，能形成 DN 的必须是显著的互动属性。"},
  tableBed:{page:"6.3.3",quote:"英语介词 in 编码的是三维空间关系，on 则是二维关系（如 in the room, on the paper），但我们却可以说 on the table, on the bed, on the chair（参见 Herskovits 1986）。这种互动属性同样也反映在汉语的编码方式里，它一方面体现在方位词的选择上，如我们说“桌子上、床上、椅子上”而不说“*桌子里、*床里、*椅子里”（Tai 1993）",zh:"桌子、床、椅子的显著互动属性是二维的：英语说 on the table，汉语说“桌子上”并搭配量词“张”。"},
  defaultRound:{page:"6.3.3",quote:"最主要的原因是，“圆”被看作是球的缺省（default）属性，即球在正常情况下通常是圆的（尽管确实存在扁状的球如橄榄球等），或者说，原型的球都是圆的。这样，圆作为球的原型属性，通过Lakoff（1987）提到的范畴化过程中以偏（原型的球）概全（所有的球）的转喻效应，而丧失了原本具有的区别性，其潜在的分类性在很大程度上就被中和了。",zh:"“圆”是球的缺省属性，经以偏概全的转喻效应失去区别性，故无“椭圆球、扁球”。"},
  croftMarked:{page:"6.3.3",quote:"Croft(1990)指出，共存于单个词、短语或构造里的不同范畴，其取值的组合有的是无标记的，这种无标记的关联又称作“自然关联（natural correlation）”，它定义出的是原型的情形；另一些组合则体现出程度不等的标记性。",zh:"关联的标记性：与事物最频繁相系的属性是无标记关联，定义原型情形。"},
  gender:{page:"6.3.3",quote:"(14) 显示，当男女性别与特定社会角色并无显著的关联偏向时，“男 N”“女 N”往往都能成立……不过，按一般的认知模式（即 Lakoff 1987 所说的“老套 stereotype”），相当多的社会角色被看作是仅由或通常由男性充任的，如英雄、战士、将军、国王、强盗、流氓等。也就是说，“男”属性与这些事物之间的概念关联是无标记的，原型性的，而“女”属性的关联是有标记的，非原型的。",zh:"“男”与英雄、战士等角色的关联是无标记的，故能说“女英雄”而“男英雄”勉强。"},
  markReverse:{page:"6.3.3",quote:"(17) 若属性 D1 和 N 之间的关联是无标记的， D2 和 N 的关联是有标记的，则 D1N 若能成立，它在意义上是有标记的，而 D2N 则是无标记的。",zh:"标记性逆转：无标记关联构成的 DN 反而意义上有标记，如“死人”无标记而“活人”有标记。"},
  dirtyIcm:{page:"6.3.3",quote:"由前面的讨论及人们的一般经验可以推知，可变属性D对事物N而言的显著程度应取决于它关涉特定互动行为的程度，具体而言，a)若此属性的存在与否直接影响到相关的互动行为，或由此互动行为所决定，b)若对此属性的判断存在着明确的标准，而其标准来自相关的互动行为，c)若消除此属性也是依照一套规约程度较高，较固定的行为模式，那么，此属性就应该是显著的。",zh:"可变属性的显著性三条件：影响互动行为、判断标准来自互动行为、按固定模式消除。"},
  dirtyGrad:{page:"6.3.3",quote:"我们注意到，“脏 N”在可接受性上也存在一定的差别，而其可接受的程度正好与事物一属性关系契合上述 ICM 的程度成正比，即越符合这个 ICM 的要求，就越容易构成合法的 DN。吕叔湘(1981)曾指出，虽然“脏衣服”可以说，但“‘脏鞋’却不能说。",zh:"“脏 N”可接受性与契合 ICM 的程度成正比：脏鞋比脏糖可接受，低于脏衣服。"},
  basicLevel:{page:"6.3.3",quote:"我们认为，这或许能从认知心理学家提出的“基本层次范畴”的理论中找到答案(参见第二章)。(22a)里的“碗、筷子、衣服、袜子”等都是基本层次的概念，而“象牙筷子、瓷碗、丝袜”等则是低一个层次的概念。基本层次概念的一个显著特征就是，在这个层次上的范畴成员可引起人们在行为上大致相同的运动反应，即所涉及的互动行为具有较一致的模式",zh:"基本层次范畴引起一致的行为反应，故“脏瓷碗、脏丝袜”难以形成稳固次范畴。"},
  emptyN:{page:"6.3.3",quote:"(28)提到的物体都可以有容纳他物的功能，也都可以是空的（“……是空的”的说法都能成立），因此它们都可算作广义的容器。不过，只有(28a)里的物体才可称作“原型的容器”，它们最主要、最显著的功能就是容纳，人们与它们原型性的互动行为就是用其他物品去填充它们或将这些物品从中取出",zh:"原型容器的首要功能是容纳，故“空碗、空房间”能说而“空汽车、空山洞”不能说。"},
  coolN:{page:"6.3.3",quote:"(29)里的“水”之所以能按“凉、冷、热”的属性分出规约的类，是因为尽管人和水可以有各种各样的互动关系（喝水、用水洗涤等），但无论哪一种，都会涉及热感器官（如皮肤和口腔粘膜）和水的直接接触；“茶”也是一样，原型的互动行为是“人喝茶”",zh:"凉冷热属性的显著性取决于互动中是否必然涉及热感器官接触，故有“凉水”无“凉脸”。"},
  heavyN:{page:"6.3.3",quote:"(30)里的例子的可接受性有三个等级：“重担子”最好，“？重箱子”其次，“重书架”最差。其原因很清楚，即“重”属性在涉及这些物体的原型互动行为模式中地位不同。",zh:"“重”在互动模式中的地位决定重 N 的等级：担子＞箱子＞书架。"},
  full8:{page:"6.3.4",quote:"现在看第3类单音形容词，即能相当自由地构成DN的类。这类形容词非常少，主要只有“大，小，新，旧，好，坏，真，假”这几个（吕叔湘1981）。",zh:"“全能”单音形容词只有八个：大小新旧好坏真假。"},
  freq9:{page:"6.3.4",quote:"我们根据北京师大统计中小学语文教材得出的“现代汉语三千常用词表”找出了最常用的50个单音形容词，上面的八个词都在其中。这些词实际上分为四对，其中“大、新、好、真”是无标记的，它们的出现频率在单音形容词中都排在前7名之内，分别为第3,7,1,6位。",zh:"八个词都在最常用 50 个单音形容词中，频率高是其外在表现而非根本原因。"},
  dixon:{page:"6.3.4",quote:"根据Dixon(1982)的研究，有些语言里完全没有形容词，有些语言的形容词是数量很少的封闭类（如非洲的豪萨语），在后一类语言里，这些词代表的是哪些属性并不是任意的，而是存在着高度的一致性。例如，非洲的Ibo语只有四对形容词，它们是“大一小、新一旧、黑一白、好一坏”。",zh:"Dixon 的类型学研究：形容词封闭类语言中核心形容词高度一致，与汉语“全能”词概念重合。"},
  dsHard:{page:"6.4",quote:"“漂亮姑娘”里的“漂亮”完全可以看作是给姑娘分出规约类的一种分类属性，区别于“不漂亮的（姑娘）”，但“辉煌成就”里的“辉煌”则很难说具有这种分类意义，我们没有“不辉煌的成就”之类的说法。",zh:"双音形容词的麻烦：漂亮姑娘符合规律，辉煌成就不符合。"},
  dsReason:{page:"6.4",quote:"我们认为，上述例外情况并不是对象似原则的否定，它的出现应该是由于其他因素对象似动因的干扰和覆盖。具体说，在此起扰乱作用的主要是语体因素：口语体的双音形容词和名词组合成的DN多半符合我们上节的描述；书面语色彩较强的DN组合则往往不符。另一个需要考虑的因素是音节数目。",zh:"例外源于其他因素（语体、音节）对象似动因的干扰和覆盖。"},
  dsRules:{page:"6.4.1",quote:"这样的DN的形成限制大体和上节所述的相同。具体说，能成立的DN必须同时满足以下两条原则性的要求：1)DN中的D带上de必须能够替代整个定中结构，即所谓可省略中心名词。……2)D所代表的属性应该出现在汉语里事物N的规约分类模式中。",zh:"口语双音 DN 两条原则：D 的须能替代整个结构；D 的属性须在 N 的规约分类模式中。"},
  lv63:{page:"6.4.1",quote:"吕叔湘(1963)指出，这类组合一般都带de，如“容易的字|可笑的人|普通的水|现成的车|详细的图|奇怪的梦”等。可以不带de的，名词往往限于“人|事儿|话”等少数几个。",zh:"双音形容词和单音名词组合一般带 de，可不带 de 的名词往往限于“人、事儿、话”。"},
  renShiHua:{page:"6.4.1",quote:"值得一提的是，“人|事儿|话”之所以能与较多的双音形容词组合，其中恐怕也有认知上的原因。若说上面的“大、小、好、坏”等形容词代表的是能给事物作出最为概括的规约分类的属性，此处的“人、事儿、话”则代表了人在与其所处环境互动的过程中最需要分类的三种最根本的事物：一是主体（人），一是主体的所言（话），一是主体的所行（事儿）。",zh:"人、事儿、话是互动中最需要分类的三种根本事物，故能与较多双音形容词构成 DN。"},
  huang92:{page:"6.4.2",quote:"黄国营(1982)认为仅从语义上判断会有困难，故提出一条形式上的鉴别方式，即“形de名”可变换为“不形de名”的，定语为区别性，中心语可省。如“正确的观点”可变换为“不正确的观点”，也可说“正确的”；“辉煌的成就”不可变换为“不辉煌的成就”，也不能单说“辉煌的”。",zh:"黄国营的鉴别式：能否变换为“不 D 的”并省中心语。"},
  nonvacuous:{page:"6.4.2",quote:"Croft(1990)指出过，对同一现象换用两种不同的解释原则，而又无法提出换用的条件，这样的解释才是“空解释”，为避免空解释，必须对竞争的动因明确提出适用的条件。上面提到，经济动因覆盖象似动因有着较明确的范围，即主要作用于书面语体形式，而且在此只限于双音形容词和双音名词的组合",zh:"非空解释的标准：须对竞争的动因明确提出适用条件。"},
  verbEx:{page:"6.5",quote:"(1)剩饭|病猪|活鱼|死兔子|炒番茄|煎鸡蛋|冻豆腐|烂苹果|瞎眼睛 (2)飞行时间|实验设备|办公桌子|研究资料|学习文件|伪造证件|考试成绩|健身器材|理发工具|发言提纲|发展方针|攻击目标|开拓精神|作战部队|测量仪器|创作激情|分析方法|出租汽车|滚动轴承|驾驶学校|侵略行为|赞助单位|约会地点|交流计划|批判对象|制裁措施|洗澡水",zh:"动词定语的例子：单音动词多表烹饪方式或显著属性，双音动词多表功能属性。"},
  hopthomp:{page:"6.5",quote:"他们引述的类型学证据显示，动词在语义上越是表具体可见的实际动作，在话语功能上越是用于报道特定场景中真实地发生在动作参与者身上的事件，它的动词性就越强，即在形式上就具有越多的动词特性，如可以有时、体和情态的变化；反之，就具有越少的原型动词形式特性。",zh:"Hopper & Thompson：动词的形式特性取决于其概念—功能属性。"},
  verbReason:{page:"6.5",quote:"（1）里的单音动词都不确指语境中的某个动作，如“煎、炒”并不是实指发生在特定时空中的煎、炒动作，而是表示食物的烹饪方式，“病、活、死、冻、烂”等也都表示相关事物的某个显著属性。无法表示事物的定义性属性的单音动词，即使不含任何动态特性，如“是、有、姓”，也不能直接作定语。",zh:"能直接作定语的动词表属性而非事件；“是、有、姓”不能作定语正因不表定义性属性。"},
  verbStyle:{page:"6.5",quote:"从语体特征上看，书面语色彩较强、正式用语里的动词更容易构成DN，例如，“驾驶技术”就比“开车技术”更常见，可以说“用餐地点”，却不大说“吃饭地点”，类似的对比还有“发言提纲—讲话提纲”、“工作效率—干活效率”“作战能力—打仗能力”“节能汽车—省油汽车”“捐款方式—捐钱方式”等等。",zh:"语体因素：正式、书面语色彩的动词更容易构成 DN。"},
  nnEx:{page:"6.6.1",quote:"(1)木头桌子|缎子被面|水泥地板|塑料提包|洋瓷茶壶|柏油马路|玻璃窗子|杉木扁担 (2)胡桃夹子|酱油瓶子|羊毛剪子|黑板刷子|菜篮子|墨水瓶儿|笔记本儿|金鱼缸|皮鞋油 (3)石油工人|语文老师|哲学教授|喜剧演员|舞蹈专家|种子选手|体育委员|主任医师 (4)日本电器|瑞士手表|烟台苹果|热带水果|新疆西瓜|美国电影|青岛啤酒|金华火腿 (5)a. 生物化学|脊椎动物|细菌武器|电影票|电影制片厂|百货商店|商业社会|文艺节目|历史小说|工人阶级|广播电台|期刊阅览室|玩具手枪|商品经济|化学元素|光学元件 b. 煤气炉子|学术著作|科学知识|语法术语|科研项目|古代文化|民主权利|理论文章|医学文献|地理条件|英语词典|陶瓷工艺|经济基础|理论问题|历史事实 (6)张三的钢笔|李四的耳朵|王五的妹妹|妹妹的脾气|妹妹的生命|师傅的经验",zh:"名名组合六类语义关系：(1)–(5) 可或一定不带 de，(6) 必须带 de。"},
  nnTwo:{page:"6.6.2",quote:"第一类里面又有两种情况，一是 de 可有可无的，即表材料质地的 (1)，表其他属性的 (5b)；一是一般不带 de 的，即表功能用途的 (2)，表职业身份的 (3)，表一般属性的 (5a)。……例如，可以说“体育老师（即教体育的老师）”，但不能说“体育学生（即学体育的学生）”（刘月华等 1983）",zh:"名名组合两类情况；体育老师能说而体育学生不能说，受制于认知模式。"},
  zhu57:{page:"6.6.3",quote:"(7)中国的朋友|孩子的脾气|狐狸的尾巴|老虎的屁股|咖啡的味儿|和尚的头|班主任的老师 (8)中国朋友|孩子脾气|狐狸尾巴|老虎屁股|咖啡味儿|和尚头|班主任老师",zh:"朱德熙的对立：(7) 表领属关系，(8) 表某种性质。"},
  nnPoss:{page:"6.6.3",quote:"事物 的属性在概念上往往是其不可分的一部分，而能据之以分类，并且分出的类是事物普遍接受的规约类的属性，它们与事物的概念关系自然会更加紧密，即概念的整合程度更高，或曰概念距离更小；相比之下，领有者和他所拥有的物体，不管是所谓可让渡的（如“钢笔）还是不可让渡的（如“耳朵|妹妹|脾气”），都必须被感知为两个独立的个体，二者之间有一条明确的界线，即主客的对立，否则谈不上领属关系，故其间的概念距离相对较大。",zh:"属性是事物不可分的一部分，领属双方须为独立个体，故前者不带 de 后者必须带 de。"},
  seiler:{page:"6.6.4",quote:"Seiler(1978)认为，限定关系(determination)一般可以分为两个主要类型，即专化所指(specifying a reference)和表征概念(characterizing a concept)，前者的功能主要是确定指称的对象……后者的主要功能是增加概念的内容。从类型学的角度看，在不少语言里前者往往用组合性更强的方式编码，后者则往往用粘合性更强的方式。",zh:"专化所指多用组合性方式编码，表征概念多用粘合性方式编码。"},
  witt:{page:"6.6.4",quote:"(9)a. Wittgenstein's argument b. a Wittgenstein argument (10)a. Jakobson's features b. The Jakobsonian features",zh:"英语的对立：(a) 前项一定表领属者，(b) 前项表属性，整个结构代表某个类。"},
  tolai:{page:"6.6.4",quote:"(11)a. a bul ka-i ra lulai b. a bul na lulai",zh:"Tolai 语：(11a)“酋长的孩子”用可让渡领属标记，(11b)“酋长孩子”用表属性的连接成分。"},
  sum3:{page:"6.6.5",quote:"汉语里由形容词、区别词和名词所充任的定语在语义上可概括地分为三大类型：1)表情状的，由复杂形式的形容词(包含状态形容词、形容词短语及部分双音性质形容词)构成，2)表属性的，由简单形式的形容词(包含单音形容词及部分双音性质形容词)、区别词和名词构成，3)表领域的，由名词和代词构成。",zh:"定语三大类型：表情状、表属性、表领域；前两类分别必须带 de 与大多可隐去 de。"}
};

/* ================= 基础工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const motionOK=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 角标编号 ================= */
const citeNo={};
(function numberCites(){
  $$(".cite").forEach(b=>{
    const id=b.dataset.cite;
    if(!citeNo[id]) citeNo[id]=Object.keys(citeNo).length+1;
    b.textContent=citeNo[id];
    if(!SOURCES[id]) b.title="缺出处："+id;
  });
})();

/* ================= 出处弹窗 ================= */
const citePop=$("#citePop");
let lastFocus=null;
function openCite(id){
  const s=SOURCES[id]; if(!s) return;
  $("#citeLoc").textContent="位置："+(s.ch||"第六章")+" · "+s.page+(s.page==="附注"||s.page==="封面"?"":" 节");
  $("#citeQuote").textContent="原文："+s.quote;
  $("#citeZh").textContent="转述："+s.zh;
  lastFocus=document.activeElement;
  citePop.hidden=false;
  $("#citeClose").focus();
}
function closeCite(){ citePop.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest(".cite");
  if(b){e.preventDefault();openCite(b.dataset.cite);}
});
$("#citeClose").addEventListener("click",closeCite);
citePop.addEventListener("click",e=>{if(e.target===citePop)closeCite();});

/* ================= 跳转与返回 ================= */
const backStack=[]; const backBtn=$("#backBtn");
function jumpTo(id){
  const el=document.getElementById(id); if(!el) return;
  backStack.push(scrollY);
  try{history.pushState({y:scrollY},"","#"+id);}catch(e){}
  el.scrollIntoView({behavior:motionOK()?"smooth":"auto",block:"start"});
  backBtn.classList.add("show");
}
function goBack(){
  const y=backStack.pop();
  if(y!=null) scrollTo({top:y,behavior:motionOK()?"smooth":"auto"});
  if(!backStack.length) backBtn.classList.remove("show");
}
backBtn.addEventListener("click",goBack);
addEventListener("popstate",e=>{
  if(e.state&&e.state.y!=null){backStack.pop();scrollTo({top:e.state.y,behavior:"auto"});}
  if(!backStack.length) backBtn.classList.remove("show");
});
$$("[data-jump]").forEach(b=>b.addEventListener("click",()=>jumpTo(b.dataset.jump)));

/* ================= 键盘 ================= */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!citePop.hidden){closeCite();return;}
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  const scenes=$$("[data-scene]");
  const cur=scenes.findIndex(s=>{const r=s.getBoundingClientRect();return r.top>=-80&&r.top<innerHeight*0.5;});
  if(e.key==="ArrowRight"&&cur<scenes.length-1){scenes[cur+1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
  if(e.key==="ArrowLeft"&&cur>0){scenes[cur-1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
});

/* ================= 主题与字号 ================= */
const themeBtn=$("#themeBtn");
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  store.set("np6theme",t||"auto");
  themeBtn.textContent=t==="dark"?"◑ 暗":t==="light"?"◑ 亮":"◐ 明暗";
}
applyTheme(store.get("np6theme")||"auto");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"auto";
  const dark=cur==="dark"||(cur==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(dark?"light":"dark");
});
const FS=[15.5,17,18.5,20];
let fsIdx=Number(store.get("np6fsIdx")||1);
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px");store.set("np6fsIdx",String(fsIdx));}
applyFs();
$("#fontDown").addEventListener("click",()=>{fsIdx=Math.max(0,fsIdx-1);applyFs();});

/* ================= 阅读进度 ================= */
const resumePill=$("#resumePill"),resumeTxt=$("#resumeTxt");
let saveT=null;
addEventListener("scroll",()=>{
  if(saveT) return;
  saveT=setTimeout(()=>{
    saveT=null;
    const scenes=$$("[data-scene],[data-quiz],[data-hero]");
    let cur=scenes[0];
    for(const s of scenes){if(s.getBoundingClientRect().top<120) cur=s;}
    store.set("np6progress",JSON.stringify({id:cur.id,y:Math.round(scrollY)}));
  },400);
},{passive:true});
(function initProg(){
  let p=null;try{p=JSON.parse(store.get("np6progress")||"null");}catch(e){}
  if(p&&p.id&&scrollY<40){
    const el=document.getElementById(p.id);
    if(el){
      const h2=el.querySelector("h2");
      resumeTxt.textContent=h2?h2.textContent.replace(/^\s+/,""):"上次位置";
      resumePill.hidden=false;
      resumePill.onclick=()=>{resumePill.hidden=true;scrollTo({top:p.y,behavior:motionOK()?"smooth":"auto"});};
    }
  }
})();

/* ================= 通用点选展开 ================= */
function bindPick(listSel,attr,boxSel,txtSel,table){
  const box=$(boxSel),txt=$(txtSel),list=$(listSel);
  if(!box||!txt||!list) return;
  $$(".btn",list).forEach(b=>b.addEventListener("click",()=>{
    const k=b.getAttribute("data-"+attr);
    if(!Object.prototype.hasOwnProperty.call(table,k)) return;
    txt.textContent=table[k];
    box.hidden=false;
    box.classList.remove("wrong");
    $$(".btn",list).forEach(x=>x.classList.toggle("sel",x===b));
  }));
}
