<style>
:root{
  --paper:#fbf9f2; --card:#ffffff; --ink:#1e3a5f; --ink-soft:#4a6285; --ink-faint:#7d90ab;
  --grid:rgba(30,58,95,.06); --line:#c9d6e8; --hl:rgba(255,222,70,.55); --note:#fff3a8;
  --red:#c0392b; --green:#2d6a4f; --blue:#2f6db3; --tape:rgba(255,235,120,.75);
  --shadow:0 1px 2px rgba(30,58,95,.08),0 6px 18px rgba(30,58,95,.06);
  --fs:17px;
  font-size:var(--fs);
}
:root[data-theme="dark"]{
  --paper:#131922; --card:#1b2431; --ink:#d9e4f2; --ink-soft:#a8bcd4; --ink-faint:#6f8199;
  --grid:rgba(217,228,242,.055); --line:#33415a; --hl:rgba(255,222,70,.26); --note:#5c5320;
  --red:#ef7d6a; --green:#7fc79e; --blue:#7db3e8; --tape:rgba(255,235,120,.22);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --paper:#131922; --card:#1b2431; --ink:#d9e4f2; --ink-soft:#a8bcd4; --ink-faint:#6f8199;
    --grid:rgba(217,228,242,.055); --line:#33415a; --hl:rgba(255,222,70,.26); --note:#5c5320;
    --red:#ef7d6a; --green:#7fc79e; --blue:#7db3e8; --tape:rgba(255,235,120,.22);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-size:var(--fs); line-height:1.75; color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",SimSun,serif}
.kai{font-family:"Kaiti SC","STKaiti",KaiTi,"BiauKai",serif}
.mono{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:8px 14px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1.5px dashed var(--line)}
.topbar .tb-title{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{min-height:36px;min-width:36px;padding:4px 10px;border:1.5px solid var(--ink);border-radius:12px 4px 13px 5px/5px 13px 4px 12px;
  background:var(--card);color:var(--ink);font-size:.82rem;cursor:pointer;font-family:inherit}
.tb-btn:hover{background:var(--hl)}
.tb-sp{flex:1}
#backBtn{display:none}
#backBtn.show{display:inline-block}

/* ---------- 版面 ---------- */
.sheet{max-width:880px;margin:0 auto;padding:26px 18px 60px;position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:8px;width:2px;background:var(--red);opacity:.35}
section{margin:34px 0 46px;scroll-margin-top:64px}
h1{font-size:2.1rem;line-height:1.3;margin:.2em 0 .1em;font-weight:800;letter-spacing:.02em}
h2{font-size:1.35rem;margin:0 0 10px;font-weight:800}
h3{font-size:1.05rem;margin:0 0 6px;font-weight:700}
p{margin:.55em 0}
a{color:var(--blue)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 94%,transparent 94%);padding:0 .1em}
.hl-thick{background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 96%,transparent 96%)}
.kicker{font-size:.85rem;color:var(--ink-soft);letter-spacing:.08em}
.lead{font-size:1.02rem}

/* ---------- 便利贴 / 卡片 ---------- */
.note{position:relative;background:var(--note);color:var(--ink);
  border-radius:3px;padding:18px 18px 16px;transform:rotate(-.4deg);
  box-shadow:var(--shadow);margin:14px 0}
.note::before{content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:74px;height:22px;background:var(--tape);border-radius:2px;opacity:.85}
.note p{margin:.3em 0}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  padding:16px 16px 14px;box-shadow:var(--shadow);margin:14px 0}
.card.taped{position:relative}
.card.taped::before{content:"";position:absolute;top:-12px;right:22px;transform:rotate(6deg);
  width:62px;height:20px;background:var(--tape);border-radius:2px;opacity:.8}
.bench-label{font-size:.8rem;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:8px}

/* ---------- 场景 ---------- */
.scene-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.scene-num{flex:none;width:44px;height:44px;border:2px solid var(--red);border-radius:50% 46% 52% 48%/48% 52% 46% 50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--red);font-size:1.15rem;
  transform:rotate(-3deg);background:var(--card)}
.scene-num::before{content:attr(data-n)}
.point{font-size:1.02rem;margin:6px 0 12px}
.scene-foot{font-size:.95rem;color:var(--ink-soft);border-top:1.5px dashed var(--line);margin-top:16px;padding-top:8px}

/* ---------- 按钮 / 交互 ---------- */
.btn{min-height:44px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:14px 5px 15px 6px/6px 15px 5px 14px;
  background:var(--card);color:var(--ink);font-size:.92rem;cursor:pointer;font-family:inherit;transition:transform .08s}
.btn:hover{background:var(--hl)}
.btn:active{transform:scale(.97)}
.btn.sel{outline:2.5px solid var(--red);outline-offset:1px;background:var(--hl)}
.btn.wrong{outline:2.5px dashed var(--red);outline-offset:1px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:5px 13px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip.sel{background:var(--hl);border-color:var(--ink);font-weight:700}
.chip.right{border-color:var(--green);color:var(--green);font-weight:700}
.reveal{background:color-mix(in srgb,var(--green) 9%,var(--card));border-left:4px solid var(--green);
  border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0}
.reveal.wrong{background:color-mix(in srgb,var(--red) 8%,var(--card));border-left-color:var(--red)}
.feedback{font-size:.95rem;margin:8px 0;min-height:1.6em}
.v-ok{color:var(--green);font-weight:800;margin-right:.4em}
.v-no{color:var(--red);font-weight:800;margin-right:.4em}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.86rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
.tbl th{background:var(--hl);font-weight:700}
.tbl td.l,.tbl th.l{text-align:left}
.tbl td.hi{background:color-mix(in srgb,var(--green) 12%,var(--card));font-weight:700}
.tbl td.lo{color:var(--ink-faint)}
input[type=range]{width:100%;max-width:460px;accent-color:var(--red);height:36px}

/* ---------- 时间线（场景一） ---------- */
.tl{list-style:none;margin:12px 0 6px;padding:2px 0 2px 28px;border-left:2.5px dashed var(--line)}
.tl li{position:relative;margin:0 0 9px}
.tl li::before{content:"";position:absolute;left:-34px;top:11px;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--red)}
.tl .btn{min-height:42px;text-align:left;font-size:.9rem;padding:6px 12px;line-height:1.5}
.tl .tl-y{font-weight:800;color:var(--red);margin-right:.45em}

/* ---------- 出处角标 ---------- */
sup.cite,button.cite{-webkit-appearance:none;appearance:none;border:0;padding:0;margin:0 1px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:50%;
  background:var(--red);color:#fff;font-size:.68rem;font-weight:700;line-height:1;vertical-align:super;transform:translateY(-1px)}
sup.cite:hover,button.cite:hover{filter:brightness(1.15)}
sup.cite:focus-visible,button.cite:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;color:var(--ink-faint);vertical-align:.1em;margin-left:.35em;white-space:nowrap}
.tag[data-label="推算"]{color:var(--blue)}
.tag[data-label="示意"]{color:var(--ink-faint)}
.tag[data-label="读图"]{color:var(--green)}
.tag[data-label="解读"]{color:#8a6d1f}
.tag[data-label="例示"]{color:#8a6d1f}

/* ---------- 出处弹窗 ---------- */
#citePop{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(10,16,26,.42);padding:18px}
#citePop[hidden]{display:none}
.cite-card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;max-width:560px;width:100%;
  max-height:76vh;overflow:auto;padding:18px 18px 14px;box-shadow:var(--shadow);position:relative}
.cite-card .cc-loc{font-size:.8rem;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:6px}
.cite-card .cc-quote{font-size:.95rem;line-height:1.8;border-left:3px solid var(--red);padding-left:12px;margin:8px 0}
.cite-card .cc-zh{font-size:.95rem;margin:8px 0}
.cite-card .cc-note{font-size:.78rem;color:var(--ink-faint);margin:10px 0 0}
.cc-close{position:absolute;top:8px;right:8px;width:38px;height:38px;border:1.5px solid var(--line);border-radius:50%;
  background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}

/* ---------- 折页 ---------- */
details{border:1.5px dashed var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;background:var(--card)}
details summary{cursor:pointer;font-weight:700;font-size:.95rem;min-height:32px;display:flex;align-items:center;gap:6px}
details summary::marker{color:var(--red)}
details[open] summary{border-bottom:1.5px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
details ul{margin:.3em 0;padding-left:1.3em}
details li{margin:.25em 0}

/* ---------- 图形 ---------- */
figure{margin:14px 0}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:.8rem;color:var(--ink-soft);margin-top:6px}
.figbox{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:14px 12px 10px}
.inline-svg{background:var(--card);border:1.5px dashed var(--line);border-radius:10px;padding:10px 8px 6px;margin:10px 0}
#balBeam,#panL,#panR{transition:transform .18s ease}
@media (prefers-reduced-motion: reduce){
  #balBeam,#panL,#panR{transition:none}
}

/* ---------- 页脚 / 浮动 ---------- */
footer.site{font-size:.82rem;color:var(--ink-faint);border-top:1.5px dashed var(--line);margin-top:44px;padding-top:14px}
#resumePill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;border:1.5px solid var(--ink);
  background:var(--card);border-radius:999px;padding:9px 18px;font-size:.88rem;box-shadow:var(--shadow);cursor:pointer;
  display:flex;gap:8px;align-items:center;min-height:44px}
#resumePill[hidden]{display:none}
.navline{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.navline .btn{flex:1;text-align:center}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .sheet{padding:20px 12px 60px}
  h1{font-size:1.7rem}
  .topbar .tb-title{display:none}
  .note{transform:none}
}
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto!important}
}
</style>
</head>

<header class="topbar">
  <span class="tb-title kai">《认知语言学与汉语名词短语》· 课堂交互笔记</span>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="fontDown" aria-label="缩小字号">A−</button>
  <button class="tb-btn" id="fontUp" aria-label="放大字号">A+</button>
  <button class="tb-btn" id="themeBtn" aria-label="切换明暗">◐ 明暗</button>
