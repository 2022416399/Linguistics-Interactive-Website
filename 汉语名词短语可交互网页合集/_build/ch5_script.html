<script>
"use strict";
/* ================= 事实账本（出处库） ================= */
const SOURCES = {
  bookInfo:{ch:"第五章",page:"封面",quote:"认知语言学与汉语名词短语 ＞ 作者：张敏",zh:"《认知语言学与汉语名词短语》（张敏 著）第五章"},
  threeProp:{page:"5.1",quote:"我们已在前一章概括地介绍了本书下需要研究的问题。为叙述清楚起见，有必要先把这项研究的主要结论更明确地表述出来。这些结论可归纳为以下三个相互关联、层层推进的命题：",zh:"下篇的主要结论归纳为三个相互关联、层层推进的命题。"},
  prop1:{page:"5.1",quote:"(1)定中之间因 de 字的隐现而有别的形式距离平行于其间的概念距离。",zh:"命题 (1)：两类名词短语的形式差别平行于意义差别，故其形式构造由象似动因促动。"},
  propRel:{page:"5.1",quote:"(1)(2)直接与de字隐现的问题相关，(3)是我们观察到多项定语语序安排的象似规律之后提出的一个扩展的命题。其中，对(1)和(2)的证明是我们的重点所在。其实，(1)和(2)是一个问题的两个方面，但侧重点有所不同。",zh:"(1)(2) 直接关系 de 字隐现，(3) 是扩展命题；(1) 与 (2) 是一个问题的两面。"},
  chGoal:{page:"5.1",quote:"本章主要证明的是命题(1)。由于距离象似动因是其中的关键性概念，所以我们先在下节对此作一个比较详细的说明，并介绍认知功能语言学家对这个问题的研究及他们发现的相关语言共性规律。",zh:"本章重点是命题 (1)，为此先详细说明距离象似动因并介绍相关语言共性规律。"},
  dnNote:{page:"5.1",quote:"以下将不带 de 的定中构造记为 DN，将带 de 者记为 DdN。N 指中心语名词，D 指定语，它既可理解为“定语”的汉语拼音缩写，也可理解为英语“Determiner(限定语)”的缩写。",zh:"全书记号：不带 de 的定中构造记作 DN，带 de 者记作 DdN。"},
  haimanDef:{page:"5.1",quote:"Haiman(1983)将距离动因表述为：语言成分之间的距离反映了所表达的概念的成分之间的距离。",zh:"距离动因最常被引用的界说：语言成分之间的距离反映概念成分之间的距离。"},
  givonDef:{page:"5.1",quote:"Givón(1990)称之为“相邻原则(the proximity principle)”，定义为“在功能上、概念上或认知上更接近的实体在语码的层面也放得更近”。",zh:"Givón 的界说：功能、概念或认知上更接近的实体，在语码层面也放得更近。"},
  behaghel:{page:"5.1",quote:"Behaghel(1932)在探讨德语语序时即提出过一条类似的“概念接近原则”，被后人称之为“Behaghel第一定律”",zh:"Behaghel 的“概念接近原则”被后人称为“Behaghel 第一定律”。"},
  jespersen:{page:"5.1",quote:"Jespersen(1949)也提出过一条内容相仿的“粘合原则”。不过，当代语言学家是在试图为所发现的语言共性提供解释时重新发现这个规律的，人类语言里的普遍现象为它带来了新的意义。",zh:"Jespersen 提出过内容相仿的“粘合原则”；当代语言学家在为语言共性提供解释时重新发现了这一规律。"},
  haiman85:{page:"5.1",quote:"根据Haiman(1985a)的定义，两个语言成分X和Y之间的形式距离在以下序列中依次减小：",zh:"Haiman 定义的形式距离六级序列，自上而下依次减小。"},
  ladSeq:{page:"5.1",quote:"(1)a. X # A # B # Y；b. X # A # Y；c. X + A # Y；d. X # Y；e. X + Y；f. Z",zh:"六级序列：# 代表独立的词之间的界线，+ 代表胶着在一起的语素之间的界线，Z 是由 X 和 Y 融合产生的单个语素。"},
  structDist:{page:"5.1",quote:"但更深一层看，它体现的应是结构距离，这可以从三个相互关联的角度去理解：(a) X 和 Y 及其间的成分独立性越强，语言距离就越大；(b) X 和 Y 之间的组合方式越松散，语言距离就越大；(c) X 和 Y 在结构树上跨越的节点越多，语言距离就越大，如 X 和 Y 的距离在[[AX]Y]中比在[A [XY]]中要大，尽管其线性距离完全一样。",zh:"结构距离的三个角度：成分独立性、组合方式松紧、结构树上跨越的节点数。"},
  conceptDist:{page:"5.1",quote:"(2) 若两个概念具有以下性质：a. 语义上有共同的特征、属性或组成部分；b. 互相影响；c. 在现实中不可分离；d. 被感知为一个概念单位，无论在现实中是否不可分离；则它们之间在概念领域里的距离更近。",zh:"Haiman 的概念距离定义：具有共同特征、互相影响、不可分离或被感知为一个概念单位的两者，概念距离更近。"},
  grn28:{page:"5.1",quote:"第28条特征是，若派生词缀和屈折词缀都出现在词根的同一侧，那么派生词缀一定是在词根和屈折词缀之间。换言之，派生词缀一定比屈折词缀离词根更近。",zh:"Greenberg 第 28 条：派生词缀一定比屈折词缀离词根更近。"},
  grn39:{page:"5.1",quote:"第39条特征是，当表示数和格的语缀一起出现，并都前置或后置于名词词根时，表示数的成分总是出现在名词词根和表示格的成分之间。换言之，格形式和名词词根的语言距离大过数形式。",zh:"Greenberg 第 39 条：格形式与名词词根的语言距离大过数形式。"},
  numCase:{page:"5.1",quote:"由于数语缀决定了所指的一组事物的量，因而影响到所指物的语义，它对整个词的意义的影响显然大于格语缀；格语缀的意义仅仅描述名词代表的所指物和动词代表的事件之间的关系，并不影响名词词根本身的意义。",zh:"数语缀影响所指物的语义，格语缀只描述名词与动词事件之间的关系，故前者离词根更近。"},
  bybeeSeq3:{page:"5.1",quote:"(3) 价 < 语态 < 体 < 时 < 语气 < 人称 / 数的一致",zh:"Bybee 构造的动词及其屈折语缀之间概念距离的序列，越靠左概念距离越近。"},
  bybeeSeq4:{page:"5.1",quote:"(4)( 屈折 ) 体 < 时 < 语气 < 人称和数",zh:"考察 50 种分属不同语系的语言之后，Bybee 发现的普遍语言形式距离序列。"},
  bybeeConc:{page:"5.1",quote:"她的结论是，某个范畴和动词在概念上越相关，1)它就越有可能以综合或黏附的方式和动词结合，2)在形态和语音方面两者之间的并合程度就越高，3)它的位置就离动词词根越近。",zh:"Bybee 的三条结论：概念上越相关的范畴，越可能以综合或黏附方式结合、并合程度越高、位置离词根越近。"},
  croftSub:{page:"5.1",quote:"Croft(1990)给Bybee的这项假说提供了一些证据。Croft指出，类型学的材料显示出这样一个明显的趋势：几乎所有语言都有形式完整的名词短语（即修饰语和被修饰的名词相邻的短语），大多数语言都把动词修饰语放在动词旁边，而整个句子的修饰语则经常放在句子的头一两个位置或句尾。",zh:"类型学材料支持 Bybee 的假说；Croft 认为几乎所有的成分结构都可从距离象似动因得到解释。"},
  givonScale:{page:"5.1",quote:"他考察了多种语言中的动词补足语结构，发现带补足语结构的动词的语义特性和其补足语的句法构造之间有某种系统的联系。首先，他提出了补足语类型的“约束层级（binding hierarchy）”的观念，并从语义和句法两个角度将不同类型的补足语置于不同的层级上。",zh:"Givón 发现动词的语义特性与补足语的句法构造之间有系统联系，并提出约束层级的观念。"},
  givonLaw:{page:"5.1",quote:"若语义约束层级上的某一点由某一句法编码机制表达出来，则语义尺度上更高的点不能由语法尺度上更低的点表达。它或由句法尺度上位置相同的点表达，或由一个更高的点表达。",zh:"Givón 在英语、西班牙语、芬兰语、希伯莱语等十数种语言里找到支持的类型学规律。"},
  croft7:{page:"5.1",quote:"（7）如果某个语言有两个语义相近的构造，其结构在语言距离上有所区别，则它们在概念距离上也有平行的语义区别。",zh:"Croft 提出的蕴含性语言普遍特征：语言距离有别，则概念距离也有平行的语义区别。"},
  causative:{page:"5.1",quote:"Comrie（1980）在考察了大量语言的基础上指出，这两类使役式在语义并不相同，前者通常暗示使役者和使役对象有某种物理上的直接接触，或对其造成的结果直接负责，而后者则暗示施事和受事的接触是间接的（试体会汉语里“我杀了他”和“我造成（导致）了他的死亡”的意义区别）。",zh:"凝固使役式暗示直接接触或直接负责，分析性使役式暗示间接接触。"},
  caus8d:{page:"5.1",quote:"d. ? I caused the books to leave the room.",zh:"使役对象是无生命、无知觉的物体时，复杂的使役式常常不大能成立。"},
  possDef:{page:"5.1",quote:"领属(possession)关系反映的是领属者(possessor，下称 p1)和领属物(possessum，下称 p2)这两个实体之间的某种附属关系。",zh:"领属关系是领属者与领属物这两个实体之间的某种附属关系。"},
  grn9:{page:"5.1",quote:"(9)在任何语言里，X和Y在表达不可让渡的领属关系时，其语言距离都不会比表达可让渡的领属关系时大。",zh:"Greenberg 第 (9) 条：不可让渡领属关系的语言距离不会比可让渡时更大。"},
  sixTypes:{page:"5.1",quote:"可让渡的领属关系倾向于采用(1)的序列中靠前的形式，不可让渡的领属关系则倾向于采用靠后的形式。我们至少可观察到以下几种类型：",zh:"六类领属形式的基本趋势：可让渡用靠前的形式，不可让渡用靠后的形式。"},
  scaleBody:{page:"5.1",quote:"“不可让渡”实为一个连续的概念，它构成一个具有普遍意义的等级序列：身体部位＞亲属关系＞一般物件，其中最不可让渡的是身体部位。",zh:"不可让渡的普遍等级：身体部位＞亲属关系＞一般物件；各语言的区别只在切割点的位置。"},
  cnException:{page:"5.1",quote:"根据 Haiman（1985），真正的反例似乎出现在极少的几个语言如汉语、Menya 语和 Mokilese 语里。",zh:"Haiman 认为真正的反例只出现在极少数语言里，汉语名列其中。"},
  haimanCoarse:{page:"5.1",quote:"不过，Haiman 也未能对这一现象作出进一步的说明，只是提出这个等级序列或许得出某些相应的调整，即改为“亲属关系或身体部位＞一般物件”这样一个更粗一些，但绝无例外的序列。",zh:"Haiman 未能解释汉语现象，只建议把序列改为更粗但绝无例外的形式。"},
  tai93:{page:"5.1",quote:"戴浩一(Tai 1993)虽明确提出汉语定中间de的有无确实反映了距离象似动因，但他也认为汉语领属结构中de字有无的规律比较特殊，甚至认为是Greenberg的上述第(9)条普遍特征的反例。",zh:"戴浩一认为汉语领属结构中 de 的有无是 Greenberg (9) 的反例，并以心理经验优先于物理经验来解释。"},
  fanJi56:{page:"5.1",quote:"正如范继淹（1958）所指出的，讨论DN组合同de字的有无包含两个问题：1. DN结构和DdN结构有无区别，区别何在？2. 在什么情况下出现DN结构，什么情况下出现DdN结构？",zh:"范继淹把问题分成两个：两类结构有无区别、区别何在；何时出现哪一种。"},
  zhu61Glue:{page:"5.2.1",quote:"朱德熙(1961)将 DN 和 DdN 分别称作粘合式和组合式定中结构，他指出，组合式既能以粘合式为成分，也能以组合式为成分，粘合式只能以粘合式为成分。这反映了两种形式在扩展能力上的分别，它正是其结构距离的一种体现。",zh:"粘合式只能以粘合式为成分，组合式既能以粘合式也能以组合式为成分——这正是结构距离的体现。"},
  expandLaw:{page:"5.2.2",quote:"自陆志韦(1964)开始，人们常用所谓“扩展法”(主要指能否插入de等成分)来区分复合词和短语。",zh:"扩展法：以能否插入 de 等成分区分复合词和短语。"},
  zhu56Adj:{page:"5.2.2",quote:"朱德熙将形容词分为简单形式和复杂形式两类，二者在形式和意义上都有很大的不同。前者（朱称之为甲类，即性质形容词）包括单音形容词和一般的双音形容词，后者（朱称之为乙类，即状态形容词）是在前者的基础上增加了更多的形式造出的。",zh:"甲类（简单形式）表性质，乙类（复杂形式）表状况或情态；二者作定语时与中心语的距离不同。"},
  jia3Formats:{page:"5.2.2",quote:"(2)a. 白纸(甲1) b. 白的纸(甲2) c. 雪白的纸(乙)",zh:"甲乙两类成分修饰名词的三种格式，形式距离依次增加。"},
  featTable:{page:"5.2.3",quote:"以上只是一个简单化的通俗说明，我们可以更严格地将上述三种格式语法意义上的差别用以下三类特征去描述",zh:"张敏用称谓性、分类性、述谓性三类特征描述三种格式的语法意义差别。"},
  presupAssert:{page:"5.2.3",quote:"DdN 结构实际上包含着对 D 概念和 N 概念的逻辑—语义关系的一个含义微弱的断定(assertion)，如“N 是 D 的”或“N 是与 D 有关的”，而 DN 结构不含这样一个断定，其中 D 与 N 的逻辑—语义关系是设定的(presumed)或曰预设的(presupposed)。",zh:"DdN 含有一个含义微弱的断定，DN 中 D 与 N 的关系是预设的。"},
  cabbage13:{page:"5.2.3",quote:"(13)白菜并不是白的。（比较：“*白的菜并不是白的”“黑乎乎的白菜”）",zh:"偏正复合词意义高度整合，不含属性命题，故字面相反的成分也能共处。"},
  stinky14:{page:"5.2.3",quote:"(14)臭豆腐一点也不臭。（比较：“* 臭的豆腐一点也不臭”“香喷喷的臭豆腐”）",zh:"同上：高度整合的复合名不含属性命题。"},
  double19:{page:"5.2.3",quote:"(19)a. 雪白的白衬衫。| 挺白的白衬衫。b. *雪白的白的衬衫。| *挺白的白的衬衫。",zh:"不带 de 的定语不含述谓性，可与其上加的带 de 述谓成分共存；两个带 de 述谓成分内容雷同则不成立。"},
  tiger21:{page:"5.2.3",quote:"(21)甲：“你今天有没有去看白老虎？”乙：“什么白老虎？白的老虎啊？”",zh:"游客对话：甲用 DN 类名表示已知信息，乙用 DdN 表示“白”是新信息。"},
  zhaoYuanren:{page:"5.2.3",quote:"赵元任(1968)则认为de是一种“明显修饰的记号(a marker of explicit modification)”。",zh:"赵元任认为 de 是“明显修饰的记号”；人们感觉到的“强调”“注重”正是带 de 定语述谓性的反映。"},
  predSeq:{page:"5.2.4",quote:"甲1式定语无述谓性，甲2式定语有述谓性，乙式定语有更高的述谓性。这个序列可理解为概念距离的序列，因此三类定语的形式差别可证实是由距离动因促动的。",zh:"述谓性由低到高的序列可理解为概念距离的序列，据此可证三类定语的形式差别由距离动因促动。"},
  paClass:{page:"5.2.4",quote:"Siegel(1979)根据这个特点将前一种形容词称作“述谓形容词(predicative adjectives)”，后一种称为“属性形容词(attributive adjectives)”。",zh:"Siegel 分出述谓形容词与属性形容词；汉语里正好用 de 字把这两类从形式上分化开。"},
  laoTongxue:{page:"5.2.4",quote:"但A类定语在汉语里几乎都是不带de的甲1式，它们无法以简单的方式转为谓语，如“老朋友”不能转为“（*朋友）是老的”“（*朋友）很老”之类。",zh:"A 类（属性形容词）定语几乎都是不带 de 的甲₁ 式，无法简单转为谓语。"},
  sumSeq:{page:"5.2.5",quote:"因此，分类性、称谓性和述谓性三项概念特征和关系的松紧也有一种明显的因果关联，因此5.2.3小节提到的意义序列可以阐释为概念距离的序列，即“甲1式<甲2式<乙式”。",zh:"三项特征的意义序列可阐释为概念距离的序列，与其形式距离序列完全平行。"},
  focusDistance:{page:"5.2.4",quote:"换言之，聚焦作用即是拉大相关成分之间的形式距离。无论焦点提前或是挪后，焦点成分和与其关系最密切的成分之间的结构距离都增加了。",zh:"无论焦点提前、挪后还是位置不变而带额外标记，结构距离都增大了。"},
  retina:{page:"5.2.4",quote:"注视点落在物体a上时，其像投落于视网膜的中央窝(fovea)，其背景物体的像则投在视网膜的其他位置，也就是说，前景和背景的像在视网膜上的位置存在着实际的距离。",zh:"焦点拉大概念距离有生理象似基础：前景与背景的像在视网膜上的位置存在实际距离。"},
  note1:{page:"附注",quote:"①严格地说，带de的定中结构“A的R”中的定语应是“A的”，因此将这类结构记为DdN并不确切。不过由于这里的A是定语概念的核心部分，用DdN 的标记法便于在概念距离和语言距离之间作比较，我们不得不牺牲标记的严格性而换取称述的方便。",zh:"附注①：DdN 的记法牺牲了标记的严格性，以换取在概念距离与语言距离之间作比较的方便。"},

/* ================= 基础工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const motionOK=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 角标编号 ================= */
const citeNo={};
(function numberCites(){
  $$(".cite").forEach(b=>{
    const id=b.dataset.cite;
    if(!citeNo[id]) citeNo[id]=Object.keys(citeNo).length+1;
    b.textContent=citeNo[id];
    if(!SOURCES[id]) b.title="缺出处："+id;
  });
})();

/* ================= 出处弹窗 ================= */
const citePop=$("#citePop");
let lastFocus=null;
function openCite(id){
  const s=SOURCES[id]; if(!s) return;
  $("#citeLoc").textContent="位置："+(s.ch||"第五章")+" · "+s.page+(s.page==="附注"||s.page==="封面"?"":" 节");
  $("#citeQuote").textContent="原文："+s.quote;
  $("#citeZh").textContent="转述："+s.zh;
  lastFocus=document.activeElement;
  citePop.hidden=false;
  $("#citeClose").focus();
}
function closeCite(){ citePop.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest(".cite");
  if(b){e.preventDefault();openCite(b.dataset.cite);}
});
$("#citeClose").addEventListener("click",closeCite);
citePop.addEventListener("click",e=>{if(e.target===citePop)closeCite();});

/* ================= 跳转与返回 ================= */
const backStack=[]; const backBtn=$("#backBtn");
function jumpTo(id){
  const el=document.getElementById(id); if(!el) return;
  backStack.push(scrollY);
  try{history.pushState({y:scrollY},"","#"+id);}catch(e){}
  el.scrollIntoView({behavior:motionOK()?"smooth":"auto",block:"start"});
  backBtn.classList.add("show");
}
function goBack(){
  const y=backStack.pop();
  if(y!=null) scrollTo({top:y,behavior:motionOK()?"smooth":"auto"});
  if(!backStack.length) backBtn.classList.remove("show");
}
backBtn.addEventListener("click",goBack);
addEventListener("popstate",e=>{
  if(e.state&&e.state.y!=null){backStack.pop();scrollTo({top:e.state.y,behavior:"auto"});}
  if(!backStack.length) backBtn.classList.remove("show");
});
$$("[data-jump]").forEach(b=>b.addEventListener("click",()=>jumpTo(b.dataset.jump)));

/* ================= 键盘 ================= */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!citePop.hidden){closeCite();return;}
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  const scenes=$$("[data-scene]");
  const cur=scenes.findIndex(s=>{const r=s.getBoundingClientRect();return r.top>=-80&&r.top<innerHeight*0.5;});
  if(e.key==="ArrowRight"&&cur<scenes.length-1){scenes[cur+1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
  if(e.key==="ArrowLeft"&&cur>0){scenes[cur-1].scrollIntoView({behavior:motionOK()?"smooth":"auto"});}
});

/* ================= 主题与字号 ================= */
const themeBtn=$("#themeBtn");
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  store.set("np5theme",t||"auto");
  themeBtn.textContent=t==="dark"?"◑ 暗":t==="light"?"◑ 亮":"◐ 明暗";
}
applyTheme(store.get("np5theme")||"auto");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")||"auto";
  const dark=cur==="dark"||(cur==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(dark?"light":"dark");
});
const FS=[15.5,17,18.5,20];
let fsIdx=Number(store.get("np5fsIdx")||1);
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px");store.set("np5fsIdx",String(fsIdx));}
applyFs();
$("#fontDown").addEventListener("click",()=>{fsIdx=Math.max(0,fsIdx-1);applyFs();});
$("#fontUp").addEventListener("click",()=>{fsIdx=Math.min(FS.length-1,fsIdx+1);applyFs();});

/* ================= 阅读进度 ================= */
const resumePill=$("#resumePill"),resumeTxt=$("#resumeTxt");
let saveT=null;
addEventListener("scroll",()=>{
  if(saveT) return;
  saveT=setTimeout(()=>{
    saveT=null;
    const scenes=$$("[data-scene],[data-quiz],[data-hero]");
    let cur=scenes[0];
    for(const s of scenes){if(s.getBoundingClientRect().top<120) cur=s;}
    store.set("np5progress",JSON.stringify({id:cur.id,y:Math.round(scrollY)}));
  },400);
},{passive:true});
(function initProg(){
  let p=null;try{p=JSON.parse(store.get("np5progress")||"null");}catch(e){}
  if(p&&p.id&&scrollY<40){
    const el=document.getElementById(p.id);
    if(el){
      const h2=el.querySelector("h2");
      resumeTxt.textContent=h2?h2.textContent.replace(/^\s+/,""):"上次位置";
      resumePill.hidden=false;
      resumePill.onclick=()=>{resumePill.hidden=true;scrollTo({top:p.y,behavior:motionOK()?"smooth":"auto"});};
    }
  }
})();

/* ================= 通用点选展开 ================= */
function bindPick(listSel,attr,boxSel,txtSel,table){
  const box=$(boxSel),txt=$(txtSel),list=$(listSel);
  if(!box||!txt||!list) return;
  $$(".btn",list).forEach(b=>b.addEventListener("click",()=>{
    const k=b.getAttribute("data-"+attr);
    if(!Object.prototype.hasOwnProperty.call(table,k)) return;
    txt.textContent=table[k];
    box.hidden=false;
    box.classList.remove("wrong");
    $$(".btn",list).forEach(x=>x.classList.toggle("sel",x===b));
  }));
}

  "3":"命题 (3)：汉语名词短语的基本结构规律由距离象似动因促动。——这是本书观察到多项定语语序安排的象似规律之后提出的一个扩展的命题。"

bindPick("#defBtns","d","#defBox","#defTxt",{

  "2":"Givón（1990）称之为“相邻原则（the proximity principle）”，定义为“在功能上、概念上或认知上更接近的实体在语码的层面也放得更近”。通俗地说，元素之间的表层形式连接越紧密，其意义联系往往也越紧密，因而形式关系是意义关系的临摹。",

  "4":"Jespersen（1949）也提出过一条内容相仿的“粘合原则”。不过，当代语言学家是在试图为所发现的语言共性提供解释时重新发现这个规律的，人类语言里的普遍现象为它带来了新的意义。"

/* ================= 场景三：Greenberg / Bybee ================= */
bindPick("#ggBtns","gg","#ggBox","#ggTxt",{
  "28":"第 28 条：若派生词缀和屈折词缀都出现在词根的同一侧，那么派生词缀一定是在词根和屈折词缀之间。换言之，派生词缀一定比屈折词缀离词根更近。——认知解释：派生构词法会影响到整个词的词汇意义，派生语缀代表的概念和词根的概念紧密相关；这种意义的变化往往是非常显著的（如英语“read”和“reader”）。而屈折构形法所增加的意义只是附在词根之外的更大的语言片段上，并不影响词根本身的意义，如英语的“go”变为“went”，“去”的意义并无变化，形态所增加的意义附在整个句子上。",
  "39":"第 39 条：当表示数和格的语缀一起出现，并都前置或后置于名词词根时，表示数的成分总是出现在名词词根和表示格的成分之间。换言之，格形式和名词词根的语言距离大过数形式。——认知解释：数语缀决定了所指的一组事物的量，因而影响到所指物的语义，它对整个词的意义的影响显然大于格语缀；格语缀的意义仅仅描述名词代表的所指物和动词代表的事件之间的关系，并不影响名词词根本身的意义。"
});
bindPick("#beeBtns","b","#beeBox","#beeTxt",{

  "4":"序列 (4)：（屈折）体 ＜ 时 ＜ 语气 ＜ 人称和数。——在考察了 50 种属于不同语系的语言之后，Bybee 发现的普遍语言形式距离序列。看得出，(3) 和 (4) 大体上是平行的。若某个语言使用后缀，那么其动词词形中语素的顺序具有“词根—体—时态—语态—人称”的倾向，而前缀型语言的相对语序则正好相反，是上述序列的镜象。它说明这种现象与其用次序，不如用相对距离来描述。"

/* ================= 场景七：三项特征 / 预设断定 / 述谓序列 / 焦点 ================= */
bindPick("#featBtns","f","#featBox","#featTxt",{
  "1":"I. 称谓性：能构成一个类名去称谓某个或某类事物的定中结构的特性。这个术语首先由陈琼瓒(1955)提出，陆丙甫(1988)最先用称谓性和非称谓性的对立去概括朱德熙提出的粘合式与组合式定中结构的意义区别。它可说是一种“可命名性”——可用 DN 的语言形式给某一类事物赋予一个类名，其作用就像一个表类指的单个名词。生物学上拉丁语物种名的汉译若是复合形式，一定是不带 de 的 DN 构造（其实所有的专业术语都是如此），这不是偶然的。",
  "2":"II. 分类性：能否作为给中心语概念分类的依据。形容词简单形式及名词作定语时无论带不带 de 往往都有分类性，而形容词复杂形式充任的定语一般没有分类性——“白衬衫”和“白的衬衫”都可以是对衬衫的一种有意义的分类，而“雪白的衬衫”或“白白的衬衫”则很难看成是衬衫的一类。甲₁ 式的分类是直接的；甲₂ 式则涉及两次分类过程：“白”先与事物概念发生直接联系形成“白色事物”的概念，然后“衬衫”作为白色事物的一个次类间接与“白”概念产生联系。",
  "3":"III. 述谓性：DdN 结构实际上包含着对 D 概念和 N 概念的逻辑—语义关系的一个含义微弱的断定，而 DN 结构不含这样一个断定，其中 D 与 N 的逻辑—语义关系是预设的。这项特征的分布正好跟第 I 项互补：含 de 的甲₂ 式和乙式中的定语具有述谓性但没有称谓性，不含 de 的甲₁ 式有称谓性却没有述谓性。称谓和述谓是两个对立的概念，(4) 中特征的互补分布是很自然的。"
});

  "4":"(11)a. 这支假枪原来是真的。 ✓　b. ? 这支假的枪原来是真的。 ✗——同理。陆丙甫(1988)举过一对很有启发性的例子：“一朵真的假花。｜*一朵真的假的花。”前一句能够成立，是因为其中的“真”“假”不在一个层次上；其实两句在可接受性上的差别与由 de 字隐现导致的述谓性的有无相关。",
